            const [candidates, setCandidates] = React.useState(INITIAL_CANDIDATES);
            const [employees, setEmployees] = React.useState(INITIAL_EMPLOYEES);
            const [developments, setDevelopments] = React.useState(INITIAL_DEVELOPMENTS);
            const [jobs, setJobs] = React.useState(INITIAL_JOBS);
            const [trainings, setTrainings] = React.useState(INITIAL_TRAININGS);

            const [selectedCandidateDetail, setSelectedCandidateDetail] = React.useState(null);
            const [activeStageActionModal, setActiveStageActionModal] = React.useState(null);
            const [deletingCandidateId, setDeletingCandidateId] = React.useState(null);

            const [toast, setToast] = React.useState(null);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3500);
            };

            const fetchFromSupabase = React.useCallback(async () => {
                if (!SUPABASE_URL || !SUPABASE_KEY || !window.supabase) return;
                setIsFetching(true);
                try {
                    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                    const { data: candData, error: candErr } = await supabase
                        .from('candidates')
                        .select('*')
                        .order('created_at', { ascending: false });

                    if (!candErr && candData && candData.length > 0) {
                        setCandidates(candData);
                        setIsDbConnected(true);
                        showToast(`⚡ ซิงก์ข้อมูลดึงผู้สมัครล่าสุดเรียบร้อย (${candData.length} รายการ)`);
                    }
                } catch (err) {
                    console.error('Supabase fetch error:', err);
                }
                setIsFetching(false);
            }, []);

            React.useEffect(() => {
                fetchFromSupabase();
            }, [fetchFromSupabase]);

            React.useEffect(() => {
                if (window.lucide && typeof window.lucide.createIcons === 'function') {
                    window.lucide.createIcons();
                }
            });

            // Convert Passed Candidate into Employee Profile with Employee ID
            const handleConvertToEmployee = (cand) => {
                const nextEmpNumber = employees.length + 1;
                const generatedCode = `LNC-EMP-${String(nextEmpNumber).padStart(3, '0')}`;

                const newEmp = {
                    id: 'e_' + Date.now(),
                    empCode: generatedCode,
                    name: `${cand.full_name} (${cand.nickname || 'ติวเตอร์ใหม่'})`,
                    role: cand.job_title,
                    dept: 'Academic/Tutor',
                    branchId: 'b1',
                    branchName: cand.branch_preference || 'Happitat บางนา (ชั้น 5)',
                    type: 'Full-Time',
                    source: cand.source || 'เพจ Facebook',
                    startDate: new Date().toISOString().split('T')[0],
                    skills: [
                        { name: 'Subject Knowledge (ความแม่นยำเนื้อหา)', score: 4, target: 5 },
                        { name: 'Teaching Technique (เทคนิคการสอน)', score: 4, target: 5 },
                        { name: 'Classroom Management (การควบคุมชั้นเรียน)', score: 3, target: 4 },
                        { name: 'Communication (การสื่อสารและน้ำเสียง)', score: 4, target: 5 },
                        { name: 'Student Engagement (การสร้างส่วนร่วมเด็ก)', score: 3, target: 5 }
                    ]
                };

                setEmployees([newEmp, ...employees]);
                setCandidates(candidates.map(c => c.id === cand.id ? { ...c, stage: 'Passed Probation' } : c));
                setSelectedCandidateDetail(null);
                setCurrentTab('development');
                showToast(`🎉 บรรจุคุณ ${cand.full_name} เป็นพนักงานประจำ รหัส [${generatedCode}] เรียบร้อยแล้ว!`);
            };

            const handleStageActionSave = async (candId, nextStage, evalData) => {
                const updatedCands = candidates.map(c => {
                    if (c.id === candId) {
                        const prevEvals = c.evaluations || {};
                        return {
                            ...c,
                            stage: nextStage,
                            evaluations: {
                                ...prevEvals,
                                [evalData.stage]: evalData
                            }
                        };
                    }
                    return c;
                });

                setCandidates(updatedCands);
                setActiveStageActionModal(null);
                setSelectedCandidateDetail(null);
                showToast(`ย้ายผู้สมัครไปยังขั้นตอน "${nextStage}" เรียบร้อยแล้ว`);

                if (SUPABASE_URL && SUPABASE_KEY && window.supabase) {
                    try {
                        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                        await supabase.from('candidates').update({ stage: nextStage }).eq('id', candId);
                    } catch (e) {
                        console.error(e);
                    }
                }
            };

            const handleDeleteCandidate = async (candId) => {
                setCandidates(candidates.filter(c => c.id !== candId));
                setDeletingCandidateId(null);
                setSelectedCandidateDetail(null);
                showToast('ลบข้อมูลผู้สมัครออกจากระบบเรียบร้อยแล้ว');

                if (SUPABASE_URL && SUPABASE_KEY && window.supabase) {
                    try {
                        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                        await supabase.from('candidates').delete().eq('id', candId);
                    } catch (e) {
                        console.error(e);
                    }
                }
            };

            const filterByBranch = (item) => {
                if (selectedBranch === 'ALL') return true;
                return item.branchId === selectedBranch;
            };

            return (
                <div className="flex h-screen overflow-hidden bg-lnc-bg">
                    {/* Sidebar Navigation */}
                    <aside className="w-64 bg-lnc-dark text-white flex flex-col justify-between shrink-0 shadow-lg">
                        <div>
                            <div className="p-5 border-b border-zinc-800 flex items-center justify-between">
                                <div className="flex items-center space-x-3">
                                    <div className="bg-lnc-pink text-white w-9 h-9 rounded-lg flex items-center justify-center font-bold text-xl tracking-tighter shadow-md">
                                        LNC<span className="text-xs text-white font-light">+</span>
                                    </div>
                                    <div>
                                        <h1 className="font-bold text-base leading-tight tracking-wide">LNC PLUS HR</h1>
                                        <p className="text-[10px] text-zinc-400">Step to Beyond Learning</p>
                                    </div>
                                </div>
                            </div>

                            <div className="p-4 border-b border-zinc-800">
                                <label className="text-[11px] font-semibold text-zinc-400 block mb-1">เลือกสาขา / Branch Filter</label>
                                <select 
                                    value={selectedBranch} 
                                    onChange={(e) => setSelectedBranch(e.target.value)}
                                    className="w-full bg-zinc-800 text-xs text-zinc-200 rounded-md p-2 border border-zinc-700 focus:outline-none focus:border-lnc-pink"
                                >
                                    <option value="ALL">ทุกสาขา (All Branches)</option>
                                    {INITIAL_BRANCHES.map(b => (
                                        <option key={b.id} value={b.id}>{b.name}</option>
                                    ))}
                                </select>
                            </div>

                            <nav className="p-4 space-y-1">
                                <NavItem icon="layout-dashboard" label="Dashboard Overview" active={currentTab === 'dashboard'} onClick={() => setCurrentTab('dashboard')} />
                                <NavItem icon="users" label="Recruitment ATS" badge={candidates.length} active={currentTab === 'recruitment'} onClick={() => setCurrentTab('recruitment')} />
                                <NavItem icon="user-check" label="ระบบพนักงาน & พัฒนา" badge={employees.length} active={currentTab === 'development'} onClick={() => setCurrentTab('development')} />
                                <NavItem icon="award" label="Training Hub" active={currentTab === 'training'} onClick={() => setCurrentTab('training')} />
                            </nav>
                        </div>

                        <div className="p-4 border-t border-zinc-800 flex items-center justify-between text-xs text-zinc-400">
                            <div>
                                <p className="font-medium text-zinc-200 text-xs">HR Executive Portal</p>
                                <p className={`text-[10px] ${isDbConnected ? 'text-emerald-400 font-bold' : 'text-amber-400'}`}>
                                    {isDbConnected ? '⚡ Supabase Live Connected' : '☁️ Local / GitHub Mode'}
                                </p>
                            </div>
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <main className="flex-1 flex flex-col overflow-hidden">
                        <header className="bg-white border-b border-zinc-200 px-8 py-3.5 flex items-center justify-between shadow-sm">
                            <div>
                                <h2 className="text-lg font-bold text-zinc-900">
                                    {currentTab === 'dashboard' && 'HR Executive Overview'}
                                    {currentTab === 'recruitment' && 'Recruitment Pipeline (ATS Workflow)'}
                                    {currentTab === 'development' && 'คลังระบบพนักงานประจำ & Tutor Skill Matrix'}
                                    {currentTab === 'training' && 'Training & Capability Building'}
                                </h2>
                                <p className="text-xs text-zinc-500 mt-0.5">
                                    สถาบันกวดวิชา LNC Plus • Step to Beyond Learning
                                </p>
                            </div>

                            <div className="flex items-center space-x-2">
                                <button
                                    onClick={fetchFromSupabase}
                                    disabled={isFetching}
                                    className="bg-zinc-100 hover:bg-zinc-200 text-zinc-800 text-xs font-semibold px-3 py-2 rounded-xl border border-zinc-300 flex items-center space-x-1.5 transition shadow-xs"
                                >
                                    <i data-lucide="refresh-cw" className={`w-3.5 h-3.5 text-lnc-pink ${isFetching ? 'animate-spin' : ''}`}></i>
                                    <span>{isFetching ? 'กำลังดึงข้อมูล...' : '🔄 ดึงข้อมูลผู้สมัครล่าสุด'}</span>
                                </button>
                            </div>
                        </header>

                        <div className="flex-1 overflow-y-auto p-8 custom-scrollbar">
                            {currentTab === 'dashboard' && (
                                <DashboardView 
                                    candidates={candidates.filter(filterByBranch)}
                                    employees={employees.filter(filterByBranch)}
                                    developments={developments}
                                    trainings={trainings}
                                    jobs={jobs.filter(filterByBranch)}
                                    setSelectedCandidateDetail={setSelectedCandidateDetail}
                                />
                            )}

                            {currentTab === 'recruitment' && (
                                <RecruitmentView 
                                    candidates={candidates.filter(filterByBranch)}
                                    setSelectedCandidateDetail={setSelectedCandidateDetail}
                                    onOpenStageAction={(cand) => setActiveStageActionModal(cand)}
                                />
                            )}

                            {currentTab === 'development' && (
                                <DevelopmentView 
                                    employees={employees.filter(filterByBranch)}
                                    developments={developments}
                                />
                            )}

                            {currentTab === 'training' && (
                                <TrainingView trainings={trainings} />
                            )}
                        </div>
                    </main>

                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed bottom-6 right-6 bg-zinc-900 text-white px-4 py-3 rounded-xl shadow-xl text-xs flex items-center space-x-2 border-l-4 border-lnc-pink z-50">
                            <i data-lucide="check-circle" className="w-4 h-4 text-lnc-pink"></i>
                            <span>{toast}</span>
                        </div>
                    )}

                    {/* Modals */}
                    {selectedCandidateDetail && (
                        <CandidateDetailModal 
                            candidate={selectedCandidateDetail} 
                            onClose={() => setSelectedCandidateDetail(null)} 
                            onActionClick={(cand) => {
                                setActiveStageActionModal(cand);
                            }}
                            onConvertToEmployee={handleConvertToEmployee}
                            onDeleteClick={(id) => setDeletingCandidateId(id)}
                        />
                    )}
                    {activeStageActionModal && (
                        <StageActionModal 
                            candidate={activeStageActionModal} 
                            onClose={() => setActiveStageActionModal(null)} 
                            onSaveNextStage={handleStageActionSave} 
                        />
                    )}
                    {deletingCandidateId && (
                        <ConfirmDeleteModal
                            candidateId={deletingCandidateId}
                            onClose={() => setDeletingCandidateId(null)}
                            onConfirm={handleDeleteCandidate}
                        />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
