        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("ErrorBoundary caught error:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center bg-zinc-100 p-6 text-center">
                            <div className="bg-white p-8 rounded-3xl border shadow-xl max-w-md w-full space-y-4">

                                <p className="text-xs text-zinc-500 font-mono bg-zinc-50 p-3 rounded-xl text-left overflow-auto max-h-32">
                                    {this.state.error ? this.state.error.toString() : 'Unknown Error'}
                                </p>
                                <button 
                                    onClick={() => { this.setState({ hasError: false, error: null }); window.location.reload(); }}
                                    className="w-full bg-lnc-pink hover:bg-rose-700 text-white text-xs font-bold py-3 rounded-xl shadow-md transition"
                                >
                                    🔄 รีโหลดหน้าเว็บใหม่
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        function App() {
            const [currentTab, setCurrentTab] = React.useState('dashboard');
            const [candidates, setCandidates] = React.useState([]);
            const [employees, setEmployees] = React.useState([]);
            const [trainings, setTrainings] = React.useState([]);
            const [jobQuotas, setJobQuotas] = React.useState([]);

            const [newJobTitle, setNewJobTitle] = React.useState('');
            const [newTargetQuota, setNewTargetQuota] = React.useState(5);
            const [isFetching, setIsFetching] = React.useState(false);
            const [toast, setToast] = React.useState(null);

            const [startDateFilter, setStartDateFilter] = React.useState('');
            const [endDateFilter, setEndDateFilter] = React.useState('');
            const [selectedCandidateDetail, setSelectedCandidateDetail] = React.useState(null);

            const [selectedEmpName, setSelectedEmpName] = React.useState('');
            const [courseName, setCourseName] = React.useState('');
            const [trainingDate, setTrainingDate] = React.useState('');

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3500);
            };

            const fetchGASData = async () => {
                if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("YOUR_GAS_DEPLOYMENT_ID")) {
                    showToast("⚠️ กรุณานำ Web App URL ของ Google Apps Script มาใส่ในตัวแปร GAS_WEB_APP_URL");
                    return;
                }
                setIsFetching(true);
                try {
                    const res = await fetch(GAS_WEB_APP_URL);
                    const text = await res.text();
                    let data;
                    try {
                        data = JSON.parse(text);
                    } catch (parseErr) {
                        showToast("❌ Google Apps Script ส่งค่าไม่ใช่ JSON (โปรดตั้งค่า Who has access เป็น Anyone ตอน Deploy)");
                        setIsFetching(false);
                        return;
                    }

                    if (data && data.error) {
                        showToast(`❌ Google Apps Script แจ้งข้อผิดพลาด: ${data.error}`);
                    } else if (data && Array.isArray(data.candidates)) {
                        setCandidates(data.candidates);
                        if (Array.isArray(data.quotas)) {
                            setJobQuotas(data.quotas);
                        }
                        showToast(`🔄 ซิงก์ข้อมูลจาก Google Sheets สำเร็จ (${data.candidates.length} รายการ)`);
                    } else if (Array.isArray(data)) {
                        setCandidates(data);
                        showToast(`🔄 ซิงก์ข้อมูลสำเร็จ (${data.length} รายการ)`);
                    } else {
                        setCandidates([]);
                        setJobQuotas([]);
                        showToast("ℹ️ เชื่อมต่อ Google Sheets สำเร็จ แต่ยังไม่มีข้อมูลผู้สมัครในระบบ");
                    }

                                                <select value={selectedEmpName} onChange={e => setSelectedEmpName(e.target.value)} className="w-full border p-3 rounded-2xl bg-white" required>
                                                    <option value="">-- เลือกพนักงาน --</option>
                                                    {eligibleTrainees.length === 0 ? (
                                                        <option value="" disabled>ยังไม่มีพนักงานในสถานะทดลองงาน/บรรจุ</option>
                                                    ) : (
                                                        eligibleTrainees.map(t => (
                                                            <option key={t.id} value={`${t.full_name} (${t.stage})`}>
                                                                {t.full_name} - {t.job_title} [{t.stage}]
                                                            </option>
                                                        ))
                                                    )}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="font-bold block mb-1.5 text-zinc-700">ชื่อหลักสูตรอบรม *</label>
                                                <input type="text" placeholder="เช่น เทคนิคการสอน Active Learning" value={courseName} onChange={e => setCourseName(e.target.value)} className="w-full border p-3 rounded-2xl" required />
                                            </div>
                                            <div>
                                                <label className="font-bold block mb-1.5 text-zinc-700">กำหนดวันที่อบรม *</label>
                                                <input type="date" value={trainingDate} onChange={e => setTrainingDate(e.target.value)} className="w-full border p-3 rounded-2xl" required />
                                            </div>
                                            <div className="flex items-end">
                                                <button type="submit" className="w-full bg-lnc-pink hover:bg-rose-700 text-white font-bold p-3 rounded-2xl shadow-md transition">
                                                    บันทึกและมอบหมายอบรม
                                                </button>
                                            </div>
                                        </form>
                                    </div>

                                    <div className="bg-white rounded-3xl border border-zinc-200 overflow-hidden shadow-sm">
                                        <div className="p-4 bg-zinc-100 border-b font-bold text-xs text-zinc-800">ประวัติและสถานะการฝึกอบรมพนักงานทั้งหมด</div>
                                        {trainings.length === 0 ? (
                                            <div className="p-12 text-center text-zinc-400 text-xs">ยังไม่มีประวัติการฝึกอบรม</div>
                                        ) : (
                                            <table className="w-full text-xs text-left">
                                                <thead className="border-b text-zinc-500 uppercase">
                                                    <tr>
                                                        <th className="p-4">ชื่อพนักงาน</th>
                                                        <th className="p-4">หลักสูตรอบรม</th>
                                                        <th className="p-4">วันที่อบรม</th>
                                                        <th className="p-4">สถานะ</th>
                                                        <th className="p-4">คะแนนประเมิน</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y">
                                                    {trainings.map(tr => (
                                                        <tr key={tr.id} className="hover:bg-zinc-50">
                                                            <td className="p-4 font-bold text-zinc-900">{tr.empName}</td>
                                                            <td className="p-4 font-semibold text-lnc-pink">{tr.course}</td>
                                                            <td className="p-4">{tr.date}</td>
                                                            <td className="p-4"><span className="px-2.5 py-1 rounded-full font-bold bg-amber-50 text-amber-700 border border-amber-200">{tr.status}</span></td>
                                                            <td className="p-4 font-mono font-bold">{tr.score}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        )}
                                    </div>
                                </div>
                            )}

                            {currentTab === 'settings' && (
                                <div className="space-y-6">
                                    <div className="bg-white p-6 rounded-3xl border border-zinc-200 shadow-sm space-y-4">
                                        <h3 className="font-extrabold text-sm text-zinc-900">⚙️ เพิ่มตำแหน่งงานใหม่และกำหนดโควตาเป้าหมาย (Add Job Quota)</h3>
                                        <form onSubmit={handleAddQuota} className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
                                            <div className="sm:col-span-2">
                                                <label className="font-bold block mb-1.5 text-zinc-700">ชื่อตำแหน่งงาน / สาขาวิชา *</label>
                                                <input type="text" placeholder="เช่น คุณครูประจำ - ฟิสิกส์ หรือ HR Manager" value={newJobTitle} onChange={e => setNewJobTitle(e.target.value)} className="w-full border p-3 rounded-2xl" required />
                                            </div>
                                            <div>
                                                <label className="font-bold block mb-1.5 text-zinc-700">เป้าหมายจำนวนที่รับ (คน) *</label>
                                                <input type="number" min="1" value={newTargetQuota} onChange={e => setNewTargetQuota(e.target.value)} className="w-full border p-3 rounded-2xl font-bold" required />
                                            </div>
                                            <div className="sm:col-span-3 flex justify-end">
                                                <button type="submit" className="bg-lnc-pink hover:bg-rose-700 text-white font-bold px-6 py-3 rounded-2xl shadow-md transition">
                                                    ➕ เพิ่มตำแหน่งงานในระบบ
                                                </button>
                                            </div>
                                        </form>
                                    </div>

                                    <div className="bg-white rounded-3xl border border-zinc-200 overflow-hidden shadow-sm p-6 space-y-4">
                                        <h3 className="font-extrabold text-sm text-zinc-900">📋 รายชื่อตำแหน่งงานและโควตาปัจจุบัน (ซิงก์จาก Google Sheets)</h3>
                                        {jobQuotas.length === 0 ? (
                                            <p className="text-xs text-zinc-400 py-6 text-center">ยังไม่มีโควตาตำแหน่งงานใน Google Sheets</p>
                                        ) : (
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                                                {jobQuotas.map(q => (
                                                    <div key={q.id || Math.random()} className="p-4 bg-zinc-50 rounded-2xl border border-zinc-200 flex items-center justify-between">
                                                        <div>
                                                            <h4 className="font-bold text-zinc-900 text-sm">{q.title}</h4>
                                                            <p className="text-[11px] text-zinc-400 mt-0.5">เป้าหมายกำลังคนอัตราเปิดรับ</p>
                                                        </div>
                                                        <div className="flex items-center space-x-2">
                                                            <input 
                                                                type="number" 
                                                                min="1" 
                                                                value={q.targetQuota} 
                                                                onChange={(e) => handleQuotaTargetChange(q.id, e.target.value)}
                                                                className="w-16 border-2 border-lnc-pink rounded-xl p-2 font-bold text-center bg-white text-lnc-pink" 
                                                            />
                                                            <span className="font-bold text-zinc-600">คน</span>
                                                            <button 
                                                                onClick={() => handleDeleteQuota(q.id)} 
                                                                className="text-rose-600 hover:text-rose-800 p-2 font-bold ml-2"
                                                                title="ลบตำแหน่งนี้"
                                                            >
                                                                🗑️
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {selectedCandidateDetail && (
                        <CandidateDetailModal 
                            candidate={selectedCandidateDetail} 
                            onClose={() => setSelectedCandidateDetail(null)} 
                            onQuickMove={handleQuickMoveStage}
                            onConvertToEmployee={handleConvertToEmployee}
                            onDeleteClick={handleDeleteCandidate}
                            isConverted={employees.some(e => e.name.includes(selectedCandidateDetail.full_name))}
                        />
                    )}

                    {toast && (
                        <div className="fixed bottom-6 right-6 bg-zinc-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl text-xs flex items-center space-x-2.5 border-l-4 border-lnc-pink z-50 animate-bounce">
                            <span>{toast}</span>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
