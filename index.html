<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LNC Plus - Enterprise Executive HR Management & Analytics Suite</title>

    <!-- Tailwind CSS CDN -->
    <script data-cfasync="false" src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM 18 UMD -->
    <script data-cfasync="false" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script data-cfasync="false" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone -->
    <script data-cfasync="false" src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

    <script data-cfasync="false">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lnc: {
                            pink: '#E60067',
                            pinklight: '#FFF0F5',
                            dark: '#18181B',
                            gray: '#71717A',
                            bg: '#FAFAFA'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background-color: #FAFAFA; 
            color: #18181B; 
            -webkit-tap-highlight-color: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        /* Prevent font size zoom on mobile inputs */
        input, select, textarea { font-size: 16px !important; }
        @media (min-width: 640px) {
            input, select, textarea { font-size: 0.75rem !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script data-cfasync="false" type="text/babel" data-presets="react" data-type="module">
        // ------------------------------------------------------------------------
        // 🔑 นำ Web App URL จาก Google Apps Script (doGet/doPost) มาวางที่นี่
        // ------------------------------------------------------------------------
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxBiizVZbgEgKth6hLtqxIciAhVto_9N0an1FD0quHLyQ80SWEdjJT4yVyw6wJVWgEw0g/exec";
        // ------------------------------------------------------------------------

        const ATS_STAGES = [
            { id: 'Application', title: '1. รับใบสมัคร', badgeColor: 'bg-zinc-100 text-zinc-800' },
            { id: 'Screening', title: '2. ตรวจประวัติ', badgeColor: 'bg-blue-50 text-blue-700' },
            { id: 'Interview', title: '3. สัมภาษณ์', badgeColor: 'bg-indigo-50 text-indigo-700' },
            { id: 'Demo Teaching', title: '4. ทดลองสอน (Demo)', badgeColor: 'bg-purple-50 text-purple-700' },
            { id: 'Offer', title: '5. ยื่นข้อเสนอ', badgeColor: 'bg-emerald-50 text-emerald-700' },
            { id: 'Probation', title: '6. ทดลองงาน (90 วัน)', badgeColor: 'bg-amber-50 text-amber-800' },
            { id: 'Passed Probation', title: '7. ผ่านการบรรจุ', badgeColor: 'bg-emerald-100 text-emerald-800' },
            { id: 'Backup Pool', title: 'ตัวสำรอง (Backup Pool)', badgeColor: 'bg-slate-100 text-slate-700' },
            { id: 'Rejected', title: 'ไม่ผ่านการคัดเลือก', badgeColor: 'bg-rose-50 text-rose-700' }
        ];

        function getNextStageId(currentStageId) {
            const sequence = ['Application', 'Screening', 'Interview', 'Demo Teaching', 'Offer', 'Probation', 'Passed Probation'];
            const idx = sequence.indexOf(currentStageId);
            if (idx !== -1 && idx < sequence.length - 1) {
                return sequence[idx + 1];
            }
            return null;
        }

        function Icon({ name, className = "w-4 h-4" }) {
            const icons = {
                'layout-dashboard': <path d="M3 3h7v7H3zm11 0h7v7h-7zM3 14h7v7H3zm11 0h7v7h-7z" />,
                'users': <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm14 10v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />,
                'user-check': <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm8 0 2 2 4-4" />,
                'book-open': <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zm22 0h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />,
                'settings': <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm7.4 1.5a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />,
                'refresh-cw': <path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16" />,
                'calendar': <path d="M19 4H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM16 2v4M8 2v4M3 10h18" />,
                'clock': <><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></>,
                'book': <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15z" />,
                'user': <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" />,
                'compass': <><circle cx="12" cy="12" r="10" /><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" /></>,
                'file-text': <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" /></>,
                'external-link': <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3" />,
                'arrow-right': <path d="M5 12h14M12 5l7 7-7 7" />,
                'check-circle': <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></>,
                'shield-check': <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />,
                'menu': <path d="M3 12h18M3 6h18M3 18h18" />,
                'x': <path d="M18 6L6 18M6 6l12 12" />
            };

            return (
                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    strokeWidth="2" 
                    strokeLinecap="round" 
                    strokeLinejoin="round" 
                    className={className}
                >
                    {icons[name] || <circle cx="12" cy="12" r="10" />}
                </svg>
            );
        }

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("ErrorBoundary caught error:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center bg-zinc-100 p-4 sm:p-6 text-center">
                            <div className="bg-white p-6 sm:p-8 rounded-3xl border shadow-xl max-w-md w-full space-y-4">
                                <div className="text-rose-600 font-black text-lg sm:text-xl">⚠️ พบข้อผิดพลาดในการแสดงผล</div>
                                <p className="text-xs text-zinc-500 font-mono bg-zinc-50 p-3 rounded-xl text-left overflow-auto max-h-32">
                                    {this.state.error ? this.state.error.toString() : 'Unknown Error'}
                                </p>
                                <button 
                                    onClick={() => { this.setState({ hasError: false, error: null }); window.location.reload(); }}
                                    className="w-full bg-lnc-pink hover:bg-rose-700 text-white text-xs font-bold py-3 rounded-xl shadow-md transition active:scale-95"
                                >
                                    🔄 รีโหลดหน้าเว็บใหม่
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        function NavItem({ icon, label, badge, active, onClick }) {
            return (
                <button
                    onClick={onClick}
                    className={`w-full flex items-center justify-between px-3.5 py-3 sm:py-2.5 rounded-xl text-xs font-semibold transition-all active:scale-98 ${
                        active 
                            ? 'bg-lnc-pink text-white shadow-md font-bold' 
                            : 'text-zinc-400 hover:text-white hover:bg-zinc-800'
                    }`}
                >
                    <div className="flex items-center space-x-3">
                        <Icon name={icon} className={`w-4 h-4 ${active ? 'text-white' : 'text-zinc-400'}`} />
                        <span>{label}</span>
                    </div>
                    {badge !== undefined && (
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                            active ? 'bg-white/20 text-white' : 'bg-zinc-800 text-zinc-300'
                        }`}>
                            {badge}
                        </span>
                    )}
                </button>
            );
        }

        function StatCard({ title, value, icon, color }) {
            return (
                <div className="bg-white p-4 sm:p-5 rounded-2xl border border-zinc-200 shadow-xs space-y-2">
                    <div className="flex items-center justify-between">
                        <span className="text-[11px] sm:text-xs font-bold text-zinc-500 uppercase tracking-wider">{title}</span>
                        <div className={`p-2 rounded-xl bg-zinc-50 ${color}`}>
                            <Icon name={icon} className="w-5 h-5" />
                        </div>
                    </div>
                    <div className="flex items-baseline space-x-2">
                        <span className="text-2xl sm:text-3xl font-black text-zinc-900">{value}</span>
                    </div>
                </div>
            );
        }

        function CandidateDetailModal({ candidate, onClose, onQuickMove, onConvertToEmployee, onDeleteClick, isConverted }) {
            if (!candidate) return null;

            const nextStageId = getNextStageId(candidate.stage);
            const nextStageObj = ATS_STAGES.find(s => s.id === nextStageId);
            const hasEmpCode = candidate.evals && candidate.evals.empCode;

            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 z-50 overflow-y-auto">
                    <div className="bg-white rounded-2xl sm:rounded-3xl max-w-3xl w-full max-h-[92vh] sm:max-h-[90vh] flex flex-col shadow-2xl my-auto overflow-hidden border border-zinc-100">
                        {/* Modal Header */}
                        <div className="bg-zinc-900 text-white p-5 sm:p-8 flex items-start justify-between shrink-0">
                            <div>
                                <div className="flex items-center space-x-2 flex-wrap gap-y-1">
                                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-lnc-pink text-white uppercase tracking-wider">
                                        {candidate.candidate_type || 'Tutor'}
                                    </span>
                                    <span className="text-[10px] bg-zinc-800 text-zinc-300 font-bold px-2 py-0.5 rounded-md border border-zinc-700">
                                        ID: {candidate.id}
                                    </span>
                                    {hasEmpCode && (
                                        <span className="text-[10px] bg-emerald-500 text-white font-mono font-bold px-2 py-0.5 rounded-md shadow-xs">
                                            รหัส: {candidate.evals.empCode}
                                        </span>
                                    )}
                                </div>
                                <h3 className="font-black text-xl sm:text-2xl text-white mt-2 leading-tight">
                                    {candidate.full_name} {candidate.nickname ? `(${candidate.nickname})` : ''}
                                </h3>
                                <p className="text-xs text-zinc-400 mt-1 flex items-center space-x-1">
                                    <span>ตำแหน่ง:</span>
                                    <span className="text-rose-300 font-bold">{candidate.job_title}</span>
                                </p>
                            </div>
                            <button onClick={onClose} className="text-zinc-400 hover:text-white font-bold p-2 bg-zinc-800 rounded-xl transition active:scale-95 shrink-0 ml-2">
                                <Icon name="x" className="w-5 h-5" />
                            </button>
                        </div>

                        {/* Modal Scrollable Content */}
                        <div className="p-4 sm:p-8 overflow-y-auto custom-scrollbar space-y-5 text-xs text-zinc-800 bg-zinc-50/50">
                            {/* Formal Action Box */}
                            <div className="bg-white p-4 sm:p-5 rounded-2xl border-2 border-lnc-pink/30 shadow-xs space-y-3">
                                <div className="flex items-center justify-between flex-wrap gap-1">
                                    <span className="font-extrabold text-zinc-800 text-xs flex items-center space-x-2">
                                        <Icon name="shield-check" className="w-4 h-4 text-lnc-pink" />
                                        <span>พิจารณาผู้สมัคร:</span>
                                    </span>
                                    <span className="text-[10px] font-bold px-2.5 py-1 rounded-lg bg-zinc-100 text-zinc-700 border">
                                        สถานะ: {ATS_STAGES.find(s => s.id === candidate.stage)?.title || candidate.stage}
                                    </span>
                                </div>

                                <div className="flex items-center space-x-2 flex-wrap gap-2 pt-1">
                                    {nextStageObj && (
                                        <button 
                                            onClick={() => onQuickMove(candidate.id, nextStageObj.id)}
                                            className="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2.5 rounded-xl shadow-xs transition flex items-center justify-center space-x-2 active:scale-95"
                                        >
                                            <Icon name="check-circle" className="w-4 h-4" />
                                            <span>✅ อนุมัติผ่าน ➔ "{nextStageObj.title}"</span>
                                        </button>
                                    )}

                                    <button 
                                        onClick={() => onQuickMove(candidate.id, 'Backup Pool')}
                                        className="bg-slate-700 hover:bg-slate-800 text-white font-bold px-3.5 py-2.5 rounded-xl transition active:scale-95"
                                    >
                                        📁 ย้ายไป "ตัวสำรอง"
                                    </button>

                                    <button 
                                        onClick={() => onQuickMove(candidate.id, 'Rejected')}
                                        className="bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold px-3.5 py-2.5 rounded-xl border border-rose-200 transition active:scale-95"
                                    >
                                        ❌ ไม่ผ่านการคัดเลือก
                                    </button>
                                </div>

                                <div className="pt-2 border-t flex items-center justify-between text-[11px] text-zinc-500">
                                    <span>ข้ามขั้นตอนอิสระ:</span>
                                    <select 
                                        value={candidate.stage} 
                                        onChange={(e) => onQuickMove(candidate.id, e.target.value)}
                                        className="border rounded-lg p-1.5 font-bold text-zinc-800 bg-zinc-50 focus:outline-none"
                                    >
                                        {ATS_STAGES.map(s => (
                                            <option key={s.id} value={s.id}>{s.title}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            {/* Section 1: Personal Info */}
                            <div className="bg-white p-4 sm:p-5 rounded-2xl border border-zinc-200 shadow-xs space-y-3">
                                <h4 className="font-black text-xs text-zinc-900 uppercase tracking-wider border-b pb-2 flex items-center space-x-2">
                                    <Icon name="user" className="w-4 h-4 text-lnc-pink" />
                                    <span>1. ข้อมูลส่วนตัวและการติดต่อ</span>
                                </h4>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    <div><span className="text-zinc-400 block text-[10px]">ชื่อ-สกุล:</span><strong className="text-zinc-900">{candidate.full_name}</strong></div>
                                    <div><span className="text-zinc-400 block text-[10px]">ชื่อเล่น:</span><strong className="text-zinc-900">{candidate.nickname || '-'}</strong></div>
                                    <div><span className="text-zinc-400 block text-[10px]">วันเกิด / อายุ:</span><strong className="text-zinc-900">{candidate.birthdate || '-'} ({candidate.age || '-'} ปี)</strong></div>
                                    <div><span className="text-zinc-400 block text-[10px]">เบอร์โทรศัพท์:</span><strong className="text-zinc-900">{candidate.phone || '-'}</strong></div>
                                    <div><span className="text-zinc-400 block text-[10px]">ID Line:</span><strong className="text-zinc-900">{candidate.line_id || '-'}</strong></div>
                                    <div><span className="text-zinc-400 block text-[10px]">Email:</span><strong className="text-zinc-900">{candidate.email || '-'}</strong></div>
                                    <div className="sm:col-span-2"><span className="text-zinc-400 block text-[10px]">ที่อยู่ปัจจุบัน:</span><span className="text-zinc-800">{candidate.address || '-'}</span></div>
                                    <div><span className="text-zinc-400 block text-[10px]">ยินยอม PDPA (1 ปี):</span><span className="font-bold text-emerald-600">✓ {candidate.pdpa_consent || 'ยินยอม'}</span></div>
                                </div>
                            </div>

                            {/* Section 2: Source Tracking */}
                            <div className="bg-rose-50/60 p-4 sm:p-5 rounded-2xl border border-rose-200 shadow-xs space-y-3">
                                <h4 className="font-black text-xs text-zinc-900 uppercase tracking-wider border-b border-rose-200 pb-2 flex items-center space-x-2">
                                    <Icon name="compass" className="w-4 h-4 text-lnc-pink" />
                                    <span>2. แหล่งที่มาการสมัครงาน & ผู้แนะนำ</span>
                                </h4>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div><span className="text-zinc-500 block text-[10px]">ช่องทางที่สมัคร:</span><span className="font-bold text-lnc-pink text-xs bg-white px-2.5 py-1 rounded-lg border border-rose-200 inline-block mt-0.5">{candidate.source || 'เพจ Facebook'}</span></div>
                                    <div><span className="text-zinc-500 block text-[10px]">ผู้แนะนำ:</span><span className="font-bold text-zinc-900 text-xs">{candidate.referral_name || 'ไม่มีผู้แนะนำ'}</span></div>
                                </div>
                            </div>

                            {/* Section 3: Qualifications */}
                            <div className="bg-white p-4 sm:p-5 rounded-2xl border border-zinc-200 shadow-xs space-y-3">
                                <h4 className="font-black text-xs text-zinc-900 uppercase tracking-wider border-b pb-2 flex items-center space-x-2">
                                    <Icon name="book-open" className="w-4 h-4 text-lnc-pink" />
                                    <span>3. คุณสมบัติการสอนและสาขา</span>
                                </h4>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div className="sm:col-span-2"><span className="text-zinc-400 block text-[10px]">วิชาและระดับชั้นที่สอน:</span><strong className="text-zinc-900">{candidate.teaching_detail || '-'}</strong></div>
                                    <div className="sm:col-span-2"><span className="text-zinc-400 block text-[10px]">ประสบการณ์:</span><p className="text-zinc-700 leading-relaxed mt-0.5 bg-zinc-50 p-3 rounded-xl border">{candidate.experience || '-'}</p></div>
                                    <div><span className="text-zinc-400 block text-[10px]">สาขาที่สะดวก:</span><strong className="text-lnc-pink">{candidate.branch_preference || '-'}</strong></div>
                                    <div><span className="text-zinc-400 block text-[10px]">เงินเดือนที่คาดหวัง:</span><strong className="text-emerald-700 font-mono">{candidate.expected_salary || '-'}</strong></div>
                                </div>
                            </div>

                            {/* Resume Attached File */}
                            <div className="p-4 bg-zinc-900 text-white rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-md">
                                <div className="flex items-center space-x-3">
                                    <div className="p-2.5 bg-lnc-pink text-white rounded-xl shrink-0">
                                        <Icon name="file-text" className="w-5 h-5" />
                                    </div>
                                    <div>
                                        <h5 className="font-bold text-xs">เอกสาร Resume / Portfolio / Google Drive</h5>
                                        <p className="text-[10px] text-zinc-400">ลิงก์ไฟล์แนบของผู้สมัคร</p>
                                    </div>
                                </div>
                                {candidate.resume_url ? (
                                    <a href={candidate.resume_url} target="_blank" rel="noreferrer" className="bg-lnc-pink hover:bg-rose-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl flex items-center justify-center space-x-1.5 transition shadow-xs active:scale-95">
                                        <span>เปิดดูเอกสาร</span>
                                        <Icon name="external-link" className="w-3.5 h-3.5" />
                                    </a>
                                ) : (
                                    <span className="text-xs text-zinc-400 italic">ไม่มีไฟล์แนบ</span>
                                )}
                            </div>
                        </div>

                        {/* Modal Footer */}
                        <div className="p-4 sm:p-5 bg-white border-t flex flex-col sm:flex-row items-center justify-between gap-3 shrink-0">
                            <button onClick={() => onDeleteClick(candidate.id)} className="w-full sm:w-auto text-rose-600 hover:text-rose-800 text-xs font-bold px-4 py-2.5 rounded-xl border border-rose-200 hover:bg-rose-50 transition active:scale-95 flex items-center justify-center space-x-1">
                                <span>🗑️ ลบใบสมัคร</span>
                            </button>
                            <div className="w-full sm:w-auto">
                                {(candidate.stage === 'Passed Probation' || candidate.stage === 'Probation') && (
                                    <button 
                                        onClick={() => onConvertToEmployee(candidate)}
                                        disabled={isConverted || hasEmpCode}
                                        className={`w-full text-xs font-bold px-5 py-2.5 rounded-xl transition shadow-md flex items-center justify-center space-x-1.5 active:scale-95 ${
                                            (isConverted || hasEmpCode)
                                                ? 'bg-zinc-300 text-zinc-500 cursor-not-allowed' 
                                                : 'bg-emerald-600 hover:bg-emerald-700 text-white'
                                        }`}
                                    >
                                        <Icon name="user-check" className="w-4 h-4" />
                                        <span>{(isConverted || hasEmpCode) ? `✓ บรรจุแล้ว [รหัส: ${hasEmpCode || 'ประจำ'}]` : '🎉 บรรจุพนักงานประจำ (ออกรหัส 10 หลัก)'}</span>
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [currentTab, setCurrentTab] = React.useState('dashboard');
            const [candidates, setCandidates] = React.useState([]);
            const [trainings, setTrainings] = React.useState([]);
            const [jobQuotas, setJobQuotas] = React.useState([]);

            // Mobile Menu State
            const [mobileMenuOpen, setMobileMenuOpen] = React.useState(false);

            const [newJobTitle, setNewJobTitle] = React.useState('');
            const [newTargetQuota, setNewTargetQuota] = React.useState(5);
            const [isFetching, setIsFetching] = React.useState(false);
            const [toast, setToast] = React.useState(null);

            const [startDateFilter, setStartDateFilter] = React.useState('');
            const [endDateFilter, setEndDateFilter] = React.useState('');
            const [selectedCandidateDetail, setSelectedCandidateDetail] = React.useState(null);

            const [selectedEmpName, setSelectedEmpName] = React.useState('');
            const [courseName, setCourseName] = React.useState('');
            const [trainingDate, setTrainingDate] = React.useState('');

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3500);
            };

            const fetchGASData = async () => {
                if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("YOUR_GAS_DEPLOYMENT_ID")) {
                    showToast("⚠️ กรุณานำ Web App URL ของ Google Apps Script มาใส่ในตัวแปร GAS_WEB_APP_URL");
                    return;
                }
                setIsFetching(true);
                try {
                    const res = await fetch(GAS_WEB_APP_URL);
                    const text = await res.text();
                    let data;
                    try {
                        data = JSON.parse(text);
                    } catch (parseErr) {
                        showToast("❌ Google Apps Script ส่งค่าไม่ใช่ JSON (ตั้งค่า Who has access เป็น Anyone)");
                        setIsFetching(false);
                        return;
                    }

                    if (data && data.error) {
                        showToast(`❌ Google Apps Script แจ้งข้อผิดพลาด: ${data.error}`);
                    } else if (data && Array.isArray(data.candidates)) {
                        setCandidates(data.candidates);
                        if (Array.isArray(data.quotas)) {
                            setJobQuotas(data.quotas);
                        }
                        showToast(`🔄 ซิงก์ข้อมูลสำเร็จ (${data.candidates.length} รายการ)`);
                    } else if (Array.isArray(data)) {
                        setCandidates(data);
                        showToast(`🔄 ซิงก์ข้อมูลสำเร็จ (${data.length} รายการ)`);
                    } else {
                        setCandidates([]);
                        setJobQuotas([]);
                        showToast("ℹ️ เชื่อมต่อเรียบร้อย แต่ยังไม่มีข้อมูลในระบบ");
                    }
                } catch (err) {
                    console.error(err);
                    showToast("❌ ไม่สามารถเชื่อมต่อ Google Sheets ได้");
                }
                setIsFetching(false);
            };

            React.useEffect(() => {
                fetchGASData();
            }, []);

            const employees = React.useMemo(() => {
                if (!Array.isArray(candidates)) return [];
                return candidates
                    .filter(c => c && (c.stage === 'Passed Probation' || (c.evals && c.evals.empCode)))
                    .map(c => ({
                        id: c.id,
                        empCode: (c.evals && c.evals.empCode) ? c.evals.empCode : '84910' + String(c.id).replace(/\D/g, '').slice(-5),
                        name: `${c.full_name} (${c.nickname || 'ติวเตอร์'})`,
                        role: c.job_title,
                        dept: 'Academic/Tutor',
                        branchName: c.branch_preference || 'Happitat บางนา',
                        status: 'Passed Probation',
                        source: c.source || 'Facebook'
                    }));
            }, [candidates]);

            const handleSaveQuotas = async (updatedQuotas) => {
                setJobQuotas(updatedQuotas);
                if (GAS_WEB_APP_URL && !GAS_WEB_APP_URL.includes("YOUR_GAS_DEPLOYMENT_ID")) {
                    try {
                        await fetch(GAS_WEB_APP_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'save_quotas', quotas: updatedQuotas })
                        });
                        showToast("💾 บันทึกโควตาลง Google Sheets เรียบร้อยแล้ว");
                    } catch (e) {
                        console.error(e);
                        showToast("⚠️ บันทึกโควตาไม่สำเร็จ");
                    }
                }
            };

            const handleAddQuota = (e) => {
                e.preventDefault();
                if (!newJobTitle.trim()) {
                    showToast("⚠️ กรุณาระบุชื่อตำแหน่งงาน");
                    return;
                }
                const newQ = {
                    id: 'jq_' + Date.now(),
                    title: newJobTitle.trim(),
                    targetQuota: parseInt(newTargetQuota) || 5
                };
                handleSaveQuotas([...jobQuotas, newQ]);
                setNewJobTitle('');
                setNewTargetQuota(5);
            };

            const handleDeleteQuota = (id) => {
                handleSaveQuotas(jobQuotas.filter(q => q.id !== id));
            };

            const handleQuotaTargetChange = (id, val) => {
                const updated = jobQuotas.map(q => q.id === id ? { ...q, targetQuota: Math.max(1, parseInt(val) || 0) } : q);
                handleSaveQuotas(updated);
            };

            const filteredCandidates = React.useMemo(() => {
                if (!Array.isArray(candidates)) return [];
                return candidates.filter(c => {
                    if (!c) return false;
                    const dateStr = String(c.created_at || '');
                    if (startDateFilter && dateStr && dateStr < startDateFilter) return false;
                    if (endDateFilter && dateStr && dateStr > endDateFilter) return false;
                    return true;
                });
            }, [candidates, startDateFilter, endDateFilter]);

            const handleQuickMoveStage = async (candId, newStage, empCodeToSave = null) => {
                setCandidates(candidates.map(c => {
                    if (c.id === candId) {
                        const updatedEvals = empCodeToSave ? { ...(c.evals || {}), empCode: empCodeToSave } : c.evals;
                        return { ...c, stage: newStage, evals: updatedEvals };
                    }
                    return c;
                }));

                if (selectedCandidateDetail && selectedCandidateDetail.id === candId) {
                    const updatedEvals = empCodeToSave ? { ...(selectedCandidateDetail.evals || {}), empCode: empCodeToSave } : selectedCandidateDetail.evals;
                    setSelectedCandidateDetail({ ...selectedCandidateDetail, stage: newStage, evals: updatedEvals });
                }

                const stageTitle = ATS_STAGES.find(s => s.id === newStage)?.title || newStage;
                showToast(`อนุมัติย้ายผู้สมัครไปยังขั้นตอน "${stageTitle}"`);

                if (GAS_WEB_APP_URL && !GAS_WEB_APP_URL.includes("YOUR_GAS_DEPLOYMENT_ID")) {
                    try {
                        const payload = { action: 'update_stage', id: candId, stage: newStage };
                        if (empCodeToSave) {
                            payload.empCode = empCodeToSave;
                        }
                        await fetch(GAS_WEB_APP_URL, {
                            method: 'POST',
                            body: JSON.stringify(payload)
                        });
                    } catch (err) {
                        console.error('GAS update error:', err);
                    }
                }
            };

            const handleConvertToEmployee = (cand) => {
                const hasEmpCode = cand.evals && cand.evals.empCode;
                if (hasEmpCode || cand.stage === 'Passed Probation') {
                    showToast(`⚠️ คุณ ${cand.full_name} ได้รับการบรรจุเรียบร้อยแล้ว`);
                    return;
                }

                const random10Digit = Math.floor(1000000000 + Math.random() * 9000000000).toString();
                handleQuickMoveStage(cand.id, 'Passed Probation', random10Digit);
                setSelectedCandidateDetail(null);
                showToast(`🎉 บรรจุคุณ ${cand.full_name} เป็นพนักงานประจำสำเร็จ! รหัสพนักงาน: [${random10Digit}]`);
            };

            const handleDeleteCandidate = async (candId) => {
                setCandidates(candidates.filter(c => c.id !== candId));
                setSelectedCandidateDetail(null);
                showToast("🗑️ ลบข้อมูลผู้สมัครเรียบร้อยแล้ว");

                if (GAS_WEB_APP_URL && !GAS_WEB_APP_URL.includes("YOUR_GAS_DEPLOYMENT_ID")) {
                    try {
                        await fetch(GAS_WEB_APP_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'delete', id: candId })
                        });
                    } catch (err) {
                        console.error('GAS delete error:', err);
                    }
                }
            };

            const eligibleTrainees = filteredCandidates.filter(c => c.stage === 'Probation' || c.stage === 'Passed Probation');

            const handleAddTraining = (e) => {
                e.preventDefault();
                if (!selectedEmpName || !courseName || !trainingDate) {
                    showToast("⚠️ กรุณากรอกข้อมูลการอบรมให้ครบถ้วน");
                    return;
                }
                const newT = {
                    id: 't_' + Date.now(),
                    empName: selectedEmpName,
                    course: courseName,
                    date: trainingDate,
                    status: 'In Progress',
                    score: '-'
                };
                setTrainings([newT, ...trainings]);
                setCourseName('');
                showToast(`📚 เพิ่มหลักสูตรอบรมให้ ${selectedEmpName} เรียบร้อยแล้ว`);
            };

            const sources = ['เพจ Facebook', 'กลุ่มหางานใน Facebook', 'Fastwork', 'IG', 'เพื่อนแนะนำ', 'อื่นๆ'];
            const sourceStats = sources.map(src => {
                const count = filteredCandidates.filter(c => (c.source || 'เพจ Facebook') === src).length;
                const passedCount = filteredCandidates.filter(c => (c.source || 'เพจ Facebook') === src && (c.stage === 'Probation' || c.stage === 'Passed Probation')).length;
                return { name: src, count, passedCount };
            });

            return (
                <div className="flex h-screen overflow-hidden bg-zinc-50 relative">
                    {/* Mobile Menu Backdrop Overlay */}
                    {mobileMenuOpen && (
                        <div 
                            onClick={() => setMobileMenuOpen(false)} 
                            className="fixed inset-0 bg-black/50 z-40 md:hidden transition-opacity" 
                        />
                    )}

                    {/* Responsive Sidebar Navigation */}
                    <aside className={`fixed inset-y-0 left-0 z-50 w-64 bg-zinc-900 text-white flex flex-col justify-between shrink-0 shadow-xl transform transition-transform duration-300 md:static md:translate-x-0 ${
                        mobileMenuOpen ? 'translate-x-0' : '-translate-x-full'
                    }`}>
                        <div>
                            <div className="p-5 sm:p-6 border-b border-zinc-800 flex items-center justify-between">
                                <div className="flex items-center space-x-3">
                                    <div className="bg-lnc-pink text-white w-9 h-9 sm:w-10 sm:h-10 rounded-2xl flex items-center justify-center font-black text-base sm:text-lg shadow-md">
                                        LNC<span className="text-xs font-light">+</span>
                                    </div>
                                    <div>
                                        <h1 className="font-extrabold text-sm text-white">LNC Plus HR</h1>
                                        <p className="text-[10px] text-zinc-400">Executive HR Management</p>
                                    </div>
                                </div>
                                <button onClick={() => setMobileMenuOpen(false)} className="md:hidden text-zinc-400 hover:text-white p-1">
                                    <Icon name="x" className="w-5 h-5" />
                                </button>
                            </div>
                            <nav className="p-3 sm:p-4 space-y-1.5">
                                <NavItem icon="layout-dashboard" label="ภาพรวม Dashboard & Headcount" active={currentTab === 'dashboard'} onClick={() => { setCurrentTab('dashboard'); setMobileMenuOpen(false); }} />
                                <NavItem icon="users" label={`Recruitment ATS (${filteredCandidates.length})`} active={currentTab === 'ats'} onClick={() => { setCurrentTab('ats'); setMobileMenuOpen(false); }} />
                                <NavItem icon="user-check" label={`ระบบพนักงาน (${employees.length})`} active={currentTab === 'employees'} onClick={() => { setCurrentTab('employees'); setMobileMenuOpen(false); }} />
                                <NavItem icon="book-open" label="ติดตามการอบรมพนักงาน" active={currentTab === 'training'} onClick={() => { setCurrentTab('training'); setMobileMenuOpen(false); }} />
                                <NavItem icon="settings" label="ตั้งค่าโควตาตำแหน่งงาน" active={currentTab === 'settings'} onClick={() => { setCurrentTab('settings'); setMobileMenuOpen(false); }} />
                            </nav>
                        </div>
                        <div className="p-4 border-t border-zinc-800 text-[10px] text-zinc-400">
                            Google Sheets Live Sync Connected
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <main className="flex-1 flex flex-col overflow-hidden w-full">
                        <header className="bg-white border-b px-4 sm:px-8 py-3.5 sm:py-4 flex items-center justify-between shadow-xs">
                            <div className="flex items-center space-x-3">
                                <button 
                                    onClick={() => setMobileMenuOpen(true)} 
                                    className="md:hidden p-2 rounded-xl bg-zinc-100 text-zinc-800 hover:bg-zinc-200 active:scale-95 transition"
                                >
                                    <Icon name="menu" className="w-5 h-5" />
                                </button>
                                <h2 className="text-xs sm:text-base font-bold text-zinc-900 line-clamp-1">
                                    {currentTab === 'dashboard' && 'HR Executive Dashboard & Headcount Tracking'}
                                    {currentTab === 'ats' && 'Recruitment ATS Pipeline'}
                                    {currentTab === 'employees' && 'คลังข้อมูลพนักงานประจำ'}
                                    {currentTab === 'training' && 'ระบบติดตามการฝึกอบรมพนักงาน'}
                                    {currentTab === 'settings' && 'การตั้งค่าโควตาอัตรากำลังคน'}
                                </h2>
                            </div>
                            <button onClick={fetchGASData} disabled={isFetching} className="bg-zinc-100 hover:bg-zinc-200 text-zinc-800 text-xs font-bold px-3 py-2 sm:px-4 sm:py-2.5 rounded-xl border flex items-center space-x-1.5 transition shadow-xs shrink-0 active:scale-95">
                                <Icon name="refresh-cw" className={`w-3.5 h-3.5 text-lnc-pink ${isFetching ? 'animate-spin' : ''}`} />
                                <span className="hidden sm:inline">{isFetching ? 'กำลังซิงก์...' : '🔄 ซิงก์ Google Sheets'}</span>
                            </button>
                        </header>

                        <div className="flex-1 overflow-y-auto p-4 sm:p-8 custom-scrollbar space-y-6 sm:space-y-8">
                            {/* Dashboard View */}
                            {currentTab === 'dashboard' && (
                                <div className="space-y-6">
                                    {/* Date Filter Bar */}
                                    <div className="bg-white p-4 sm:p-5 rounded-2xl border border-zinc-200 shadow-xs flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-xs">
                                        <div className="flex items-center space-x-2.5">
                                            <Icon name="calendar" className="w-4 h-4 text-lnc-pink" />
                                            <span className="font-bold text-zinc-800">กรองสถิติตามช่วงวันที่สมัคร:</span>
                                        </div>
                                        <div className="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                                            <input type="date" value={startDateFilter} onChange={e => setStartDateFilter(e.target.value)} className="border rounded-xl p-2 bg-zinc-50 flex-1 sm:flex-none" />
                                            <span>ถึง</span>
                                            <input type="date" value={endDateFilter} onChange={e => setEndDateFilter(e.target.value)} className="border rounded-xl p-2 bg-zinc-50 flex-1 sm:flex-none" />
                                            {(startDateFilter || endDateFilter) && (
                                                <button onClick={() => { setStartDateFilter(''); setEndDateFilter(''); }} className="bg-zinc-100 hover:bg-zinc-200 px-3 py-2 rounded-xl font-bold active:scale-95">ล้างตัวกรอง</button>
                                            )}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-5">
                                        <StatCard title="ผู้สมัครทั้งหมดตามช่วงเวลา" value={filteredCandidates.length} icon="users" color="text-zinc-900" />
                                        <StatCard title="อยู่ระหว่างทดลองงาน" value={filteredCandidates.filter(c => c.stage === 'Probation').length} icon="clock" color="text-amber-600" />
                                        <StatCard title="ผ่านการบรรจุประจำ" value={filteredCandidates.filter(c => c.stage === 'Passed Probation').length} icon="user-check" color="text-emerald-600" />
                                        <StatCard title="หลักสูตรอบรมทั้งหมด" value={trainings.length} icon="book" color="text-lnc-pink" />
                                    </div>

                                    {/* Position Capacity */}
                                    <div className="bg-white p-5 sm:p-6 rounded-3xl border border-zinc-200 shadow-xs space-y-4">
                                        <div className="flex justify-between items-center">
                                            <div>
                                                <h3 className="font-extrabold text-xs sm:text-sm text-zinc-900">📈 อัตรากำลังคน & ตำแหน่งที่เปิดรับ (Position Capacity)</h3>
                                                <p className="text-[10px] text-zinc-500 mt-0.5">นับรวมผู้สมัครที่อยู่ในสถานะ Probation และ Passed Probation</p>
                                            </div>
                                            <button onClick={() => setCurrentTab('settings')} className="text-xs text-lnc-pink font-bold hover:underline">⚙️ ตั้งค่าโควตา</button>
                                        </div>

                                        {jobQuotas.length === 0 ? (
                                            <p className="text-xs text-zinc-400 py-4 text-center">ยังไม่มีข้อมูลตำแหน่งงานในระบบ</p>
                                        ) : (
                                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 text-xs">
                                                {jobQuotas.map(jq => {
                                                    if (!jq) return null;
                                                    const jqTitle = String(jq.title || '');
                                                    const targetQuotaNum = Number(jq.targetQuota) || 1;
                                                    
                                                    const probationCount = filteredCandidates.filter(c => {
                                                        if (!c || !c.job_title) return false;
                                                        const baseJobTitle = jqTitle.split(' - ')[0] || jqTitle;
                                                        return String(c.job_title).toLowerCase().includes(baseJobTitle.toLowerCase()) && c.stage === 'Probation';
                                                    }).length;

                                                    const passedCount = filteredCandidates.filter(c => {
                                                        if (!c || !c.job_title) return false;
                                                        const baseJobTitle = jqTitle.split(' - ')[0] || jqTitle;
                                                        return String(c.job_title).toLowerCase().includes(baseJobTitle.toLowerCase()) && c.stage === 'Passed Probation';
                                                    }).length;

                                                    const totalFilled = probationCount + passedCount;
                                                    const remaining = Math.max(0, targetQuotaNum - totalFilled);

                                                    return (
                                                        <div key={jq.id || Math.random()} className="p-4 sm:p-5 bg-zinc-50 rounded-2xl border border-zinc-200 space-y-3 shadow-2xs">
                                                            <div className="flex justify-between items-start font-bold">
                                                                <div>
                                                                    <h4 className="text-zinc-900 text-xs sm:text-sm">{jqTitle || 'ไม่ระบุตำแหน่ง'}</h4>
                                                                    <span className="text-[10px] text-zinc-500 font-normal">โควตา: {targetQuotaNum} อัตรา</span>
                                                                </div>
                                                                <span className="text-xs sm:text-sm font-black text-lnc-pink font-mono bg-white px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-xl border border-rose-100 shrink-0">
                                                                    {totalFilled} / {targetQuotaNum} คน
                                                                </span>
                                                            </div>

                                                            <div className="w-full bg-zinc-200 h-2.5 sm:h-3 rounded-full overflow-hidden flex">
                                                                <div className="bg-amber-500 h-full transition-all" style={{ width: `${Math.min((probationCount / targetQuotaNum) * 100, 100)}%` }}></div>
                                                                <div className="bg-emerald-600 h-full transition-all" style={{ width: `${Math.min((passedCount / targetQuotaNum) * 100, 100)}%` }}></div>
                                                            </div>

                                                            <div className="flex justify-between items-center text-[10px] pt-1">
                                                                <span className="text-amber-700 font-bold bg-amber-50 px-1.5 py-0.5 rounded border">🟡 ทดลอง: {probationCount}</span>
                                                                <span className="text-emerald-800 font-bold bg-emerald-50 px-1.5 py-0.5 rounded border">🟢 บรรจุ: {passedCount}</span>
                                                                <span className="font-extrabold text-zinc-600 bg-white px-1.5 py-0.5 rounded border">คงเหลือ: {remaining}</span>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>

                                    {/* Source Analytics */}
                                    <div className="bg-white p-5 sm:p-6 rounded-3xl border border-zinc-200 shadow-xs space-y-4">
                                        <h3 className="font-extrabold text-xs sm:text-sm text-zinc-900">📊 วิเคราะห์แหล่งที่มาผู้สมัคร (Source Quality Analytics)</h3>
                                        <div className="space-y-3.5">
                                            {sourceStats.map(s => {
                                                const pct = filteredCandidates.length > 0 ? Math.round((s.count / filteredCandidates.length) * 100) : 0;
                                                return (
                                                    <div key={s.name} className="space-y-1 text-xs">
                                                        <div className="flex justify-between font-bold flex-wrap gap-1">
                                                            <span className="text-zinc-800">{s.name}</span>
                                                            <span className="text-emerald-700">{s.count} คน ({pct}%) | ผ่าน: {s.passedCount} คน</span>
                                                        </div>
                                                        <div className="w-full bg-zinc-100 h-2.5 sm:h-3 rounded-full overflow-hidden">
                                                            <div className="bg-lnc-pink h-full rounded-full transition-all" style={{ width: `${pct}%` }}></div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* ATS Pipeline View */}
                            {currentTab === 'ats' && (
                                <div className="space-y-4">
                                    <div className="bg-zinc-900 text-white p-5 sm:p-6 rounded-3xl shadow-xs flex items-center justify-between">
                                        <div>
                                            <h3 className="font-bold text-xs sm:text-sm">บอร์ดคัดเลือกผู้สมัคร (ATS Pipeline)</h3>
                                            <p className="text-[11px] text-zinc-400 mt-0.5">กดอนุมัติผ่าน หรือย้ายขั้นตอนได้อย่างยืดหยุ่น</p>
                                        </div>
                                    </div>

                                    {filteredCandidates.length === 0 ? (
                                        <div className="bg-white p-12 rounded-3xl text-center border text-zinc-400 text-xs">
                                            ยังไม่มีข้อมูลผู้สมัครในระบบ
                                        </div>
                                    ) : (
                                        <div className="flex gap-3 overflow-x-auto pb-4 custom-scrollbar snap-x snap-mandatory">
                                            {ATS_STAGES.map(stage => {
                                                const stageCandidates = filteredCandidates.filter(c => c.stage === stage.id);
                                                const nextStageId = getNextStageId(stage.id);
                                                const nextStageObj = ATS_STAGES.find(s => s.id === nextStageId);

                                                return (
                                                    <div key={stage.id} className="p-3.5 rounded-2xl border w-[260px] sm:w-[280px] shrink-0 flex flex-col h-[580px] bg-zinc-100/70 border-zinc-200 snap-align-start">
                                                        <div className="flex items-center justify-between pb-2 mb-2 border-b">
                                                            <h4 className="text-[11px] font-extrabold text-zinc-800 uppercase line-clamp-1">{stage.title}</h4>
                                                            <span className="text-[10px] bg-zinc-200 text-zinc-800 font-bold px-2 py-0.5 rounded-full">{stageCandidates.length}</span>
                                                        </div>

                                                        <div className="space-y-2.5 flex-1 overflow-y-auto custom-scrollbar pr-1">
                                                            {stageCandidates.map(c => {
                                                                const hasEmpCode = c.evals && c.evals.empCode;
                                                                return (
                                                                    <div key={c.id} className="bg-white p-3 rounded-2xl border border-zinc-200 shadow-2xs space-y-2 hover:shadow-xs transition">
                                                                        <div className="flex justify-between items-center text-[9px]">
                                                                            <span className="font-bold text-lnc-pink bg-rose-50 px-1.5 py-0.5 rounded-md border border-rose-100">{c.source || 'Facebook'}</span>
                                                                            <span className="text-zinc-400">{c.created_at || 'ล่าสุด'}</span>
                                                                        </div>
                                                                        <div>
                                                                            <h5 className="font-bold text-xs text-zinc-900">{c.full_name} {c.nickname ? `(${c.nickname})` : ''}</h5>
                                                                            <p className="text-[10px] text-zinc-500 line-clamp-1 mt-0.5">{c.job_title}</p>
                                                                            {hasEmpCode && (
                                                                                <span className="text-[9px] text-emerald-700 bg-emerald-50 border border-emerald-200 font-mono font-bold px-1.5 py-0.5 rounded mt-1 inline-block">
                                                                                    ID: {hasEmpCode}
                                                                                </span>
                                                                            )}
                                                                        </div>

                                                                        <div className="pt-1 flex flex-col space-y-1.5">
                                                                            {nextStageObj && (
                                                                                <button 
                                                                                    onClick={() => handleQuickMoveStage(c.id, nextStageObj.id)}
                                                                                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-[10px] font-bold py-1.5 rounded-lg transition active:scale-95"
                                                                                >
                                                                                    <span>อนุมัติ ➔ {nextStageObj.title.split('.')[1] || nextStageObj.title}</span>
                                                                                </button>
                                                                            )}

                                                                            <select 
                                                                                value={c.stage} 
                                                                                onChange={(e) => handleQuickMoveStage(c.id, e.target.value)}
                                                                                className="text-[9px] border rounded-lg p-1 font-bold bg-zinc-50 text-zinc-800 focus:outline-none"
                                                                            >
                                                                                {ATS_STAGES.map(s => (
                                                                                    <option key={s.id} value={s.id}>{s.title}</option>
                                                                                ))}
                                                                            </select>

                                                                            <button onClick={() => setSelectedCandidateDetail(c)} className="w-full bg-zinc-900 hover:bg-black text-white text-[10px] py-1.5 rounded-lg font-bold transition active:scale-95">
                                                                                ดูประวัติเต็ม ➔
                                                                            </button>
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* Official Employee Directory View */}
                            {currentTab === 'employees' && (
                                <div className="space-y-4">
                                    <div className="bg-zinc-900 text-white p-5 sm:p-6 rounded-3xl flex justify-between items-center shadow-xs">
                                        <div>
                                            <h3 className="font-bold text-xs sm:text-sm">คลังพนักงานประจำ (Official Employee Directory)</h3>
                                            <p className="text-[11px] text-zinc-400 mt-0.5">พนักงานที่ผ่านการบรรจุจะมีรหัสประจำตัว 10 หลักซิงก์จาก Google Sheets</p>
                                        </div>
                                    </div>
                                    <div className="bg-white rounded-3xl border border-zinc-200 overflow-hidden shadow-xs">
                                        {employees.length === 0 ? (
                                            <div className="p-12 text-center text-zinc-400 text-xs">
                                                ยังไม่มีพนักงานประจำในระบบ
                                            </div>
                                        ) : (
                                            <div className="overflow-x-auto custom-scrollbar">
                                                <table className="w-full text-xs text-left min-w-[600px]">
                                                    <thead className="bg-zinc-100 border-b text-zinc-700 uppercase">
                                                        <tr>
                                                            <th className="p-3.5 sm:p-4">รหัส (10 หลัก)</th>
                                                            <th className="p-3.5 sm:p-4">ชื่อ-นามสกุล</th>
                                                            <th className="p-3.5 sm:p-4">ตำแหน่ง</th>
                                                            <th className="p-3.5 sm:p-4">แผนก</th>
                                                            <th className="p-3.5 sm:p-4">สาขา</th>
                                                            <th className="p-3.5 sm:p-4">แหล่งที่มา</th>
                                                            <th className="p-3.5 sm:p-4">สถานะ</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y">
                                                        {employees.map(emp => (
                                                            <tr key={emp.id} className="hover:bg-zinc-50">
                                                                <td className="p-3.5 sm:p-4 font-mono font-black text-lnc-pink">{emp.empCode}</td>
                                                                <td className="p-3.5 sm:p-4 font-bold text-zinc-900">{emp.name}</td>
                                                                <td className="p-3.5 sm:p-4">{emp.role}</td>
                                                                <td className="p-3.5 sm:p-4">{emp.dept}</td>
                                                                <td className="p-3.5 sm:p-4">{emp.branchName}</td>
                                                                <td className="p-3.5 sm:p-4 font-semibold text-rose-600">{emp.source || 'Facebook'}</td>
                                                                <td className="p-3.5 sm:p-4"><span className="bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full">{emp.status}</span></td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* Training Tracker View */}
                            {currentTab === 'training' && (
                                <div className="space-y-6">
                                    <div className="bg-white p-5 sm:p-6 rounded-3xl border border-zinc-200 shadow-xs space-y-4">
                                        <h3 className="font-extrabold text-xs sm:text-sm text-zinc-900">📚 มอบหมายหลักสูตรฝึกอบรม</h3>
                                        <form onSubmit={handleAddTraining} className="grid grid-cols-1 sm:grid-cols-4 gap-3 text-xs">
                                            <div>
                                                <label className="font-bold block mb-1 text-zinc-700">เลือกพนักงาน *</label>
                                                <select value={selectedEmpName} onChange={e => setSelectedEmpName(e.target.value)} className="w-full border p-2.5 rounded-xl bg-white" required>
                                                    <option value="">-- เลือกพนักงาน --</option>
                                                    {eligibleTrainees.map(t => (
                                                        <option key={t.id} value={`${t.full_name} (${t.stage})`}>
                                                            {t.full_name} - {t.job_title} [{t.stage}]
                                                        </option>
                                                    ))}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="font-bold block mb-1 text-zinc-700">ชื่อหลักสูตรอบรม *</label>
                                                <input type="text" placeholder="เช่น Active Learning" value={courseName} onChange={e => setCourseName(e.target.value)} className="w-full border p-2.5 rounded-xl" required />
                                            </div>
                                            <div>
                                                <label className="font-bold block mb-1 text-zinc-700">วันที่อบรม *</label>
                                                <input type="date" value={trainingDate} onChange={e => setTrainingDate(e.target.value)} className="w-full border p-2.5 rounded-xl" required />
                                            </div>
                                            <div className="flex items-end">
                                                <button type="submit" className="w-full bg-lnc-pink hover:bg-rose-700 text-white font-bold p-2.5 rounded-xl shadow-xs transition active:scale-95">
                                                    บันทึกการอบรม
                                                </button>
                                            </div>
                                        </form>
                                    </div>

                                    <div className="bg-white rounded-3xl border border-zinc-200 overflow-hidden shadow-xs">
                                        <div className="p-4 bg-zinc-100 border-b font-bold text-xs text-zinc-800">ประวัติการฝึกอบรม</div>
                                        {trainings.length === 0 ? (
                                            <div className="p-8 text-center text-zinc-400 text-xs">ยังไม่มีประวัติการฝึกอบรม</div>
                                        ) : (
                                            <div className="overflow-x-auto custom-scrollbar">
                                                <table className="w-full text-xs text-left min-w-[500px]">
                                                    <thead className="border-b text-zinc-500 uppercase">
                                                        <tr>
                                                            <th className="p-3.5">ชื่อพนักงาน</th>
                                                            <th className="p-3.5">หลักสูตร</th>
                                                            <th className="p-3.5">วันที่</th>
                                                            <th className="p-3.5">สถานะ</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y">
                                                        {trainings.map(tr => (
                                                            <tr key={tr.id} className="hover:bg-zinc-50">
                                                                <td className="p-3.5 font-bold text-zinc-900">{tr.empName}</td>
                                                                <td className="p-3.5 font-semibold text-lnc-pink">{tr.course}</td>
                                                                <td className="p-3.5">{tr.date}</td>
                                                                <td className="p-3.5"><span className="px-2 py-0.5 rounded-full font-bold bg-amber-50 text-amber-700 border">{tr.status}</span></td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* Job Quota Settings View */}
                            {currentTab === 'settings' && (
                                <div className="space-y-6">
                                    <div className="bg-white p-5 sm:p-6 rounded-3xl border border-zinc-200 shadow-xs space-y-4">
                                        <h3 className="font-extrabold text-xs sm:text-sm text-zinc-900">⚙️ เพิ่มตำแหน่งงานใหม่และกำหนดโควตา</h3>
                                        <form onSubmit={handleAddQuota} className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                                            <div className="sm:col-span-2">
                                                <label className="font-bold block mb-1 text-zinc-700">ชื่อตำแหน่งงาน *</label>
                                                <input type="text" placeholder="เช่น คุณครูประจำ - ฟิสิกส์" value={newJobTitle} onChange={e => setNewJobTitle(e.target.value)} className="w-full border p-2.5 rounded-xl" required />
                                            </div>
                                            <div>
                                                <label className="font-bold block mb-1 text-zinc-700">เป้าหมายจำนวนที่รับ (คน) *</label>
                                                <input type="number" min="1" value={newTargetQuota} onChange={e => setNewTargetQuota(e.target.value)} className="w-full border p-2.5 rounded-xl font-bold" required />
                                            </div>
                                            <div className="sm:col-span-3 flex justify-end">
                                                <button type="submit" className="w-full sm:w-auto bg-lnc-pink hover:bg-rose-700 text-white font-bold px-6 py-2.5 rounded-xl shadow-xs transition active:scale-95">
                                                    ➕ เพิ่มตำแหน่งงาน
                                                </button>
                                            </div>
                                        </form>
                                    </div>

                                    <div className="bg-white rounded-3xl border border-zinc-200 overflow-hidden shadow-xs p-5 sm:p-6 space-y-4">
                                        <h3 className="font-extrabold text-xs sm:text-sm text-zinc-900">📋 รายชื่อตำแหน่งงานและโควตาปัจจุบัน</h3>
                                        {jobQuotas.length === 0 ? (
                                            <p className="text-xs text-zinc-400 py-6 text-center">ยังไม่มีโควตาตำแหน่งงานในระบบ</p>
                                        ) : (
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                                {jobQuotas.map(q => (
                                                    <div key={q.id || Math.random()} className="p-3.5 bg-zinc-50 rounded-2xl border border-zinc-200 flex items-center justify-between">
                                                        <div>
                                                            <h4 className="font-bold text-zinc-900 text-xs sm:text-sm">{q.title}</h4>
                                                            <p className="text-[10px] text-zinc-400 mt-0.5">เป้าหมายอัตราเปิดรับ</p>
                                                        </div>
                                                        <div className="flex items-center space-x-2">
                                                            <input 
                                                                type="number" 
                                                                min="1" 
                                                                value={q.targetQuota} 
                                                                onChange={(e) => handleQuotaTargetChange(q.id, e.target.value)}
                                                                className="w-14 sm:w-16 border-2 border-lnc-pink rounded-xl p-1.5 font-bold text-center bg-white text-lnc-pink" 
                                                            />
                                                            <span className="font-bold text-zinc-600">คน</span>
                                                            <button 
                                                                onClick={() => handleDeleteQuota(q.id)} 
                                                                className="text-rose-600 hover:text-rose-800 p-1 font-bold ml-1 active:scale-95"
                                                                title="ลบตำแหน่งนี้"
                                                            >
                                                                🗑️
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* Candidate Detail Modal */}
                    {selectedCandidateDetail && (
                        <CandidateDetailModal 
                            candidate={selectedCandidateDetail} 
                            onClose={() => setSelectedCandidateDetail(null)} 
                            onQuickMove={handleQuickMoveStage}
                            onConvertToEmployee={handleConvertToEmployee}
                            onDeleteClick={handleDeleteCandidate}
                            isConverted={employees.some(e => e.id === selectedCandidateDetail.id || (e.empCode && selectedCandidateDetail.evals && selectedCandidateDetail.evals.empCode))}
                        />
                    )}

                    {/* Toast Notification Popup */}
                    {toast && (
                        <div className="fixed bottom-5 right-5 left-5 sm:left-auto sm:max-w-md bg-zinc-900 text-white px-4 py-3 rounded-2xl shadow-2xl text-xs flex items-center space-x-2.5 border-l-4 border-lnc-pink z-50 animate-bounce">
                            <span>{toast}</span>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
