<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LNC Plus - Internal HR Management System (Google Sheets Connected)</title>

    <!-- Tailwind CSS -->
    <script data-cfasync="false" src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM 18 UMD -->
    <script data-cfasync="false" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script data-cfasync="false" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone -->
    <script data-cfasync="false" src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

    <script data-cfasync="false">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lnc: {
                            pink: '#E60067',
                            pinklight: '#FFF0F5',
                            dark: '#18181B',
                            gray: '#71717A',
                            bg: '#FAFAFA'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #FAFAFA; color: #18181B; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script data-cfasync="false" type="text/babel" data-presets="react" data-type="module">
        // ------------------------------------------------------------------------
        // 🔑 นำ Web App URL จาก Google Apps Script (doGet/doPost) มาวางที่นี่
        // ------------------------------------------------------------------------
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyfr1Ku-YCpE5EBY6oQLqLYi50gtDTm3FZU-ZDwe0Qz607HIm6n_K2L3Yr8x8-uDygfvQ/exec";
        // ------------------------------------------------------------------------

        const INITIAL_BRANCHES = [
            { id: 'b1', name: 'Happitat บางนา (ชั้น 5)' },
            { id: 'b2', name: 'เดอะไบรท์ พระราม 2' },
            { id: 'b3', name: 'ข้างเซ็นทรัล พระราม 2' },
            { id: 'b4', name: 'แลนมาร์ค มหาชัย' },
            { id: 'b5', name: 'The Walk ราชพฤกษ์ นนทบุรี' },
            { id: 'b6', name: 'Meta Mall เชียงใหม่' },
            { id: 'b7', name: 'EZY Learn (ออนไลน์)' }
        ];

        const ATS_STAGES = [
            { id: 'Application', title: '1. รับใบสมัคร', stepOrder: 1 },
            { id: 'Screening', title: '2. ตรวจประวัติ', stepOrder: 2 },
            { id: 'Interview', title: '3. สัมภาษณ์', stepOrder: 3 },
            { id: 'Demo Teaching', title: '4. ทดลองสอน (Demo)', stepOrder: 4 },
            { id: 'Offer', title: '5. ยื่นข้อเสนอ', stepOrder: 5 },
            { id: 'Probation', title: '6. ทดลองงาน (90 วัน)', stepOrder: 6 },
            { id: 'Passed Probation', title: '7. บรรจุพนักงาน', stepOrder: 7 },
            { id: 'Backup Pool', title: 'รายชื่อตัวสำรอง', stepOrder: 99 },
            { id: 'Rejected', title: 'ไม่ผ่านการคัดเลือก', stepOrder: 999 }
        ];

        const INITIAL_JOBS = [
            { id: 'j1', title: 'คุณครูประจำ - คณิตศาสตร์ (ม.1-ม.6)', dept: 'Academic/Tutor', type: 'Full-Time', status: 'Open' },
            { id: 'j2', title: 'ติวเตอร์ (พาร์ทไทม์) - ฟิสิกส์ A-Level', dept: 'Academic/Tutor', type: 'Part-Time', status: 'Open' },
            { id: 'j3', title: 'Operation Admin สาขาเดอะไบรท์ พระราม 2', dept: 'Branch Staff', type: 'Full-Time', status: 'Open' },
            { id: 'j4', title: 'CS (Customer Service & Student Care)', dept: 'Branch Staff', type: 'Full-Time', status: 'Open' }
        ];

        function Icon({ name, className = "w-4 h-4" }) {
            switch (name) {
                case 'check-circle': return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
                case 'refresh': return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>;
                case 'users': return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>;
                case 'briefcase': return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>;
                case 'bookmark': return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" /></svg>;
                case 'user-check': return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>;
                case 'eye': return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>;
                default: return null;
            }
        }

        function StatCard({ title, value, icon, subtitle, color }) {
            return (
                <div className="bg-white p-5 rounded-xl border border-zinc-200 shadow-sm space-y-2">
                    <div className="flex items-center justify-between">
                        <span className="text-xs font-bold text-zinc-500 uppercase tracking-wider">{title}</span>
                        <div className={`p-2 rounded-lg bg-zinc-50 ${color}`}>
                            <Icon name={icon} className="w-5 h-5" />
                        </div>
                    </div>
                    <div className="flex items-baseline space-x-2">
                        <span className="text-2xl font-black text-zinc-900">{value}</span>
                    </div>
                    {subtitle && <p className="text-[11px] text-zinc-400 leading-tight">{subtitle}</p>}
                </div>
            );
        }

        function CandidateDetailModal({ candidate, onClose, onActionClick, onConvertToEmployee }) {
            if (!candidate) return null;

            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                    <div className="bg-white rounded-2xl max-w-3xl w-full max-h-[90vh] flex flex-col shadow-2xl my-auto overflow-hidden border border-zinc-200">
                        <div className="bg-zinc-900 text-white p-6 flex items-start justify-between">
                            <div>
                                <div className="flex items-center space-x-2">
                                    <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-lnc-pink text-white uppercase tracking-wider">
                                        {candidate.candidate_type || 'Tutor'} Profile
                                    </span>
                                    <span className="text-[10px] bg-zinc-800 text-zinc-300 font-bold px-2 py-0.5 rounded border border-zinc-700">
                                        ID: {candidate.id}
                                    </span>
                                </div>
                                <h3 className="font-black text-xl text-white mt-1">
                                    {candidate.full_name} {candidate.nickname ? `(${candidate.nickname})` : ''}
                                </h3>
                                <p className="text-xs text-zinc-400 mt-0.5">
                                    ตำแหน่งที่สมัคร: <span className="text-rose-300 font-semibold">{candidate.job_title}</span>
                                </p>
                            </div>
                            <button onClick={onClose} className="text-zinc-400 hover:text-white font-bold p-1 text-lg">✕</button>
                        </div>

                        <div className="p-6 overflow-y-auto custom-scrollbar space-y-6 text-xs text-zinc-800">
                            <div className="space-y-3">
                                <h4 className="font-black text-xs text-zinc-900 uppercase tracking-wider border-b pb-1.5">1. ข้อมูลส่วนตัวและการติดต่อ</h4>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-zinc-50 p-4 rounded-xl border border-zinc-200">
                                    <div><span className="text-zinc-400 block text-[10px]">ชื่อ-สกุล:</span><strong className="text-zinc-900">{candidate.full_name}</strong></div>
                                    <div><span className="text-zinc-400 block text-[10px]">ชื่อเล่น:</span><strong className="text-zinc-900">{candidate.nickname || '-'}</strong></div>
                                    <div><span className="text-zinc-400 block text-[10px]">วันเกิด / อายุ:</span><strong className="text-zinc-900">{candidate.birthdate || '-'} ({candidate.age || '-'} ปี)</strong></div>
                                    <div><span className="text-zinc-400 block text-[10px]">เบอร์โทรศัพท์:</span><strong className="text-zinc-900">{candidate.phone || '-'}</strong></div>
                                    <div><span className="text-zinc-400 block text-[10px]">ID Line:</span><strong className="text-zinc-900">{candidate.line_id || '-'}</strong></div>
                                    <div><span className="text-zinc-400 block text-[10px]">Email:</span><strong className="text-zinc-900">{candidate.email || '-'}</strong></div>
                                    <div className="sm:col-span-2"><span className="text-zinc-400 block text-[10px]">ที่อยู่ปัจจุบัน:</span><span className="text-zinc-800">{candidate.address || '-'}</span></div>
                                    <div><span className="text-zinc-400 block text-[10px]">ยินยอม PDPA:</span><span className="font-bold text-emerald-600">✓ {candidate.pdpa_consent || 'ยินยอม'}</span></div>
                                </div>
                            </div>

                            <div className="space-y-3">
                                <h4 className="font-black text-xs text-zinc-900 uppercase tracking-wider border-b pb-1.5">2. แหล่งที่มาการสมัครงาน (Source Reference)</h4>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-rose-50/50 p-4 rounded-xl border border-rose-200">
                                    <div><span className="text-zinc-500 block text-[10px]">ช่องทางที่สมัคร:</span><span className="font-bold text-lnc-pink text-xs">{candidate.source || 'เพจ Facebook'}</span></div>
                                    <div><span className="text-zinc-500 block text-[10px]">ผู้แนะนำ:</span><span className="font-bold text-zinc-900 text-xs">{candidate.referral_name || 'ไม่มี'}</span></div>
                                </div>
                            </div>

                            <div className="space-y-3">
                                <h4 className="font-black text-xs text-zinc-900 uppercase tracking-wider border-b pb-1.5">3. ตำแหน่งและคุณสมบัติการสอน</h4>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-zinc-50 p-4 rounded-xl border border-zinc-200">
                                    <div className="sm:col-span-2"><span className="text-zinc-400 block text-[10px]">วิชา/ระดับชั้นที่สอน:</span><strong className="text-zinc-900">{candidate.teaching_detail || '-'}</strong></div>
                                    <div className="sm:col-span-2"><span className="text-zinc-400 block text-[10px]">ประสบการณ์:</span><p className="text-zinc-700 leading-relaxed mt-0.5">{candidate.experience || '-'}</p></div>
                                    <div><span className="text-zinc-400 block text-[10px]">สาขาที่สะดวก:</span><strong className="text-lnc-pink">{candidate.branch_preference || '-'}</strong></div>
                                    <div><span className="text-zinc-400 block text-[10px]">เริ่มงานได้:</span><strong className="text-zinc-900">{candidate.start_date || 'ทันที'}</strong></div>
                                </div>
                            </div>

                            <div className="p-4 bg-zinc-900 text-white rounded-xl flex items-center justify-between">
                                <div>
                                    <h5 className="font-bold text-xs">เอกสาร Resume / Portfolio</h5>
                                    <p className="text-[10px] text-zinc-400">ลิงก์แนบจากผู้สมัคร</p>
                                </div>
                                {candidate.resume_url ? (
                                    <a href={candidate.resume_url} target="_blank" rel="noreferrer" className="bg-lnc-pink hover:bg-rose-700 text-white text-xs font-bold px-4 py-2 rounded-lg transition">
                                        เปิดดู Resume
                                    </a>
                                ) : <span className="text-xs text-zinc-400">ไม่มีลิงก์</span>}
                            </div>
                        </div>

                        <div className="p-4 bg-zinc-50 border-t border-zinc-200 flex items-center justify-end space-x-2 shrink-0">
                            {candidate.stage === 'Probation' && (
                                <button onClick={() => onConvertToEmployee(candidate)} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition shadow-md">
                                    🎉 บรรจุเป็นพนักงานประจำ (ออกรหัสพนักงาน)
                                </button>
                            )}
                            <button onClick={() => onActionClick(candidate)} className="bg-lnc-pink hover:bg-rose-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition shadow-md">
                                ย้ายขั้นตอน / ประเมินผล ➔
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function StageActionModal({ candidate, onClose, onSaveNextStage }) {
            if (!candidate) return null;
            const [note, setNote] = React.useState('');

            const handlePass = (nextStage) => {
                onSaveNextStage(candidate.id, nextStage, note || 'ผ่านการประเมิน');
            };

            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4 text-xs">
                        <div className="flex justify-between items-center border-b pb-2">
                            <h3 className="font-bold text-sm text-zinc-900">อัปเดตขั้นตอน: {candidate.full_name}</h3>
                            <button onClick={onClose} className="text-zinc-400 font-bold">✕</button>
                        </div>
                        <div>
                            <label className="font-bold block mb-1">บันทึกผลการประเมิน:</label>
                            <textarea rows="3" placeholder="ระบุคอมเมนต์กรรมการ..." value={note} onChange={e => setNote(e.target.value)} className="w-full border rounded-xl p-2.5 focus:border-lnc-pink focus:outline-none"></textarea>
                        </div>
                        <div className="space-y-2 pt-2 border-t">
                            <button onClick={() => handlePass('Screening')} className="w-full py-2.5 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700">ผ่าน ➔ ตรวจประวัติ (Screening)</button>
                            <button onClick={() => handlePass('Interview')} className="w-full py-2.5 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700">ผ่าน ➔ สัมภาษณ์งาน (Interview)</button>
                            <button onClick={() => handlePass('Demo Teaching')} className="w-full py-2.5 bg-purple-600 text-white font-bold rounded-xl hover:bg-purple-700">ผ่าน ➔ ทดลองสอน (Demo Teaching)</button>
                            <button onClick={() => handlePass('Probation')} className="w-full py-2.5 bg-amber-600 text-white font-bold rounded-xl hover:bg-amber-700">ผ่าน ➔ เริ่มทดลองงาน 90 วัน (Probation)</button>
                            <div className="grid grid-cols-2 gap-2 pt-2">
                                <button onClick={() => handlePass('Backup Pool')} className="py-2 bg-slate-200 text-slate-800 font-bold rounded-xl hover:bg-slate-300">📥 เก็บเป็นตัวสำรอง</button>
                                <button onClick={() => handlePass('Rejected')} className="py-2 bg-rose-100 text-rose-700 font-bold rounded-xl hover:bg-rose-200">✕ ไม่ผ่านการคัดเลือก</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [currentTab, setCurrentTab] = React.useState('dashboard');
            const [candidates, setCandidates] = React.useState([]);
            const [employees, setEmployees] = React.useState([
                { id: 'e1', empCode: 'LNC-EMP-001', name: 'ครูพี่เอก (เอกชัย วิเศษ)', role: 'Senior Tutor', branch: 'Happitat บางนา', type: 'Full-Time', source: 'เพื่อนแนะนำ' }
            ]);
            const [isFetching, setIsFetching] = React.useState(false);
            const [selectedCandidateDetail, setSelectedCandidateDetail] = React.useState(null);
            const [activeStageModal, setActiveStageModal] = React.useState(null);
            const [toast, setToast] = React.useState(null);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3500);
            };

            const fetchCandidatesFromSheet = React.useCallback(async () => {
                if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("YOUR_GAS_DEPLOYMENT_ID")) {
                    showToast('⚠️ กรุณาใส่ GAS_WEB_APP_URL ในโค้ดเพื่อดึงข้อมูลจริงจาก Google Sheet');
                    return;
                }
                setIsFetching(true);
                try {
                    const response = await fetch(GAS_WEB_APP_URL);
                    const data = await response.json();
                    if (Array.isArray(data)) {
                        setCandidates(data);
                        showToast(`⚡ ซิงก์ข้อมูลจาก Google Sheet สำเร็จ (${data.length} รายการ)`);
                    }
                } catch (err) {
                    console.error('Fetch error:', err);
                    showToast('❌ ไม่สามารถดึงข้อมูลจาก Google Sheet ได้');
                }
                setIsFetching(false);
            }, []);

            React.useEffect(() => {
                fetchCandidatesFromSheet();
            }, [fetchCandidatesFromSheet]);

            const handleSaveNextStage = (candId, nextStage, note) => {
                setCandidates(candidates.map(c => c.id === candId ? { ...c, stage: nextStage } : c));
                setActiveStageModal(null);
                setSelectedCandidateDetail(null);
                showToast(`ย้ายผู้สมัครไปยังขั้นตอน "${nextStage}" เรียบร้อย`);
            };

            const handleConvertToEmployee = (cand) => {
                const nextEmpCode = `LNC-EMP-${String(employees.length + 1).padStart(3, '0')}`;
                const newEmp = {
                    id: 'emp_' + Date.now(),
                    empCode: nextEmpCode,
                    name: `${cand.full_name} (${cand.nickname || 'ติวเตอร์'})`,
                    role: cand.job_title,
                    branch: cand.branch_preference || 'Happitat บางนา',
                    type: 'Full-Time',
                    source: cand.source || 'เพจ Facebook'
                };
                setEmployees([newEmp, ...employees]);
                setCandidates(candidates.map(c => c.id === cand.id ? { ...c, stage: 'Passed Probation' } : c));
                setSelectedCandidateDetail(null);
                setCurrentTab('employees');
                showToast(`🎉 บรรจุพนักงานใหม่ รหัส [${nextCode}] เข้าสู่ระบบพนักงานประจำเรียบร้อย!`);
            };

            // Analytics calculations
            const totalApplicants = candidates.length;
            const probationCount = candidates.filter(c => c.stage === 'Probation').length;
            const backupCount = candidates.filter(c => c.stage === 'Backup Pool').length;
            const passedCount = candidates.filter(c => c.stage === 'Passed Probation').length;

            // Source stats
            const sourcesList = ['เพจ Facebook', 'กลุ่มหางานใน Facebook', 'Fastwork', 'IG', 'เพื่อนแนะนำ', 'อื่นๆ'];
            const sourceStats = sourcesList.map(s => ({
                name: s,
                count: candidates.filter(c => (c.source || 'เพจ Facebook') === s).length
            }));

            return (
                <div className="flex h-screen overflow-hidden bg-lnc-bg">
                    {/* Sidebar */}
                    <aside className="w-64 bg-lnc-dark text-white flex flex-col justify-between shrink-0 shadow-lg">
                        <div>
                            <div className="p-5 border-b border-zinc-800 flex items-center space-x-3">
                                <div className="bg-lnc-pink text-white w-9 h-9 rounded-lg flex items-center justify-center font-bold text-xl">
                                    LNC<span className="text-xs text-white font-light">+</span>
                                </div>
                                <div>
                                    <h1 className="font-bold text-base leading-tight">LNC PLUS HR</h1>
                                    <p className="text-[10px] text-zinc-400">Google Sheets Sync</p>
                                </div>
                            </div>

                            <nav className="p-4 space-y-1 text-xs font-semibold">
                                <button onClick={() => setCurrentTab('dashboard')} className={`w-full flex items-center space-x-2.5 px-3 py-2.5 rounded-xl transition ${currentTab === 'dashboard' ? 'bg-lnc-pink text-white font-bold' : 'text-zinc-400 hover:bg-zinc-800'}`}>
                                    <Icon name="briefcase" className="w-4 h-4" /><span>Dashboard & Analytics</span>
                                </button>
                                <button onClick={() => setCurrentTab('recruitment')} className={`w-full flex items-center space-x-2.5 px-3 py-2.5 rounded-xl transition ${currentTab === 'recruitment' ? 'bg-lnc-pink text-white font-bold' : 'text-zinc-400 hover:bg-zinc-800'}`}>
                                    <Icon name="users" className="w-4 h-4" /><span>Recruitment ATS Pipeline ({totalApplicants})</span>
                                </button>
                                <button onClick={() => setCurrentTab('backup')} className={`w-full flex items-center space-x-2.5 px-3 py-2.5 rounded-xl transition ${currentTab === 'backup' ? 'bg-lnc-pink text-white font-bold' : 'text-zinc-400 hover:bg-zinc-800'}`}>
                                    <Icon name="bookmark" className="w-4 h-4" /><span>รายชื่อตัวสำรอง (Backup Pool) ({backupCount})</span>
                                </button>
                                <button onClick={() => setCurrentTab('employees')} className={`w-full flex items-center space-x-2.5 px-3 py-2.5 rounded-xl transition ${currentTab === 'employees' ? 'bg-lnc-pink text-white font-bold' : 'text-zinc-400 hover:bg-zinc-800'}`}>
                                    <Icon name="user-check" className="w-4 h-4" /><span>ระบบพนักงานประจำ ({employees.length})</span>
                                </button>
                            </nav>
                        </div>
                        <div className="p-4 border-t border-zinc-800 text-[11px] text-zinc-400 flex items-center justify-between">
                            <span>Google Sheet Connected</span>
                            <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col overflow-hidden">
                        <header className="bg-white border-b border-zinc-200 px-8 py-3.5 flex items-center justify-between shadow-sm">
                            <h2 className="text-lg font-bold text-zinc-900">
                                {currentTab === 'dashboard' && 'แดชบอร์ดสถิติผู้สมัคร & กราฟวิเคราะห์'}
                                {currentTab === 'recruitment' && 'บอร์ดคัดเลือก ATS Pipeline'}
                                {currentTab === 'backup' && 'คลังรายชื่อตัวสำรอง (Backup Candidates)'}
                                {currentTab === 'employees' && 'รายชื่อพนักงานประจำและรหัสพนักงาน'}
                            </h2>
                            <button onClick={fetchCandidatesFromSheet} disabled={isFetching} className="bg-zinc-100 hover:bg-zinc-200 text-zinc-800 text-xs font-semibold px-3.5 py-2 rounded-xl border border-zinc-300 flex items-center space-x-1.5 transition">
                                <Icon name="refresh" className={`w-3.5 h-3.5 text-lnc-pink ${isFetching ? 'animate-spin' : ''}`} />
                                <span>{isFetching ? 'กำลังซิงก์...' : 'ซิงก์ข้อมูล Google Sheet'}</span>
                            </button>
                        </header>

                        <div className="flex-1 overflow-y-auto p-8 custom-scrollbar">
                            {currentTab === 'dashboard' && (
                                <div className="space-y-6">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                        <StatCard title="ผู้สมัครทั้งหมด" value={totalApplicants} icon="users" subtitle="ดึงตรงจาก Google Sheets" color="text-blue-600" />
                                        <StatCard title="อยู่ระหว่างทดลองงาน" value={probationCount} icon="briefcase" subtitle="Probation 90 วัน" color="text-amber-500" />
                                        <StatCard title="ตัวสำรอง (Backup Pool)" value={backupCount} icon="bookmark" subtitle="เก็บสำรองไว้เรียกสัมภาษณ์เพิ่ม" color="text-slate-600" />
                                        <StatCard title="พนักงานบรรจุแล้ว" value={passedCount} icon="user-check" subtitle="ออกรหัสพนักงานประจำ" color="text-emerald-600" />
                                    </div>

                                    {/* Application Source Analytics & Visual Bars */}
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                        <div className="bg-white p-6 rounded-2xl border border-zinc-200 shadow-sm space-y-4">
                                            <h3 className="font-extrabold text-zinc-900 text-sm border-b pb-2">📊 กราฟวิเคราะห์แหล่งที่มาผู้สมัคร (Application Source Breakdown)</h3>
                                            <div className="space-y-3">
                                                {sourceStats.map(s => {
                                                    const pct = totalApplicants > 0 ? Math.round((s.count / totalApplicants) * 100) : 0;
                                                    return (
                                                        <div key={s.name} className="space-y-1">
                                                            <div className="flex justify-between text-xs font-bold text-zinc-700">
                                                                <span>{s.name}</span>
                                                                <span className="text-lnc-pink">{s.count} คน ({pct}%)</span>
                                                            </div>
                                                            <div className="w-full bg-zinc-100 h-3 rounded-full overflow-hidden">
                                                                <div className="bg-lnc-pink h-full rounded-full transition-all duration-500" style={{ width: `${pct}%` }}></div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>

                                        <div className="bg-white p-6 rounded-2xl border border-zinc-200 shadow-sm space-y-3">
                                            <h3 className="font-extrabold text-zinc-900 text-sm border-b pb-2">📋 ผู้สมัครล่าสุด (Recent Registrations)</h3>
                                            <div className="space-y-2 overflow-y-auto max-h-[250px] custom-scrollbar pr-1">
                                                {candidates.slice(0, 5).map(c => (
                                                    <div key={c.id} className="p-3 bg-zinc-50 rounded-xl border flex items-center justify-between text-xs">
                                                        <div>
                                                            <strong className="text-zinc-900">{c.full_name} ({c.nickname || '-'})</strong>
                                                            <p className="text-zinc-500 text-[10px]">{c.job_title} • มาจาก: {c.source || 'Facebook'}</p>
                                                        </div>
                                                        <button onClick={() => setSelectedCandidateDetail(c)} className="px-3 py-1 bg-white border rounded-lg text-xs font-bold hover:border-lnc-pink">ดูประวัติ</button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {currentTab === 'recruitment' && (
                                <div className="grid grid-cols-1 md:grid-cols-7 gap-3 overflow-x-auto pb-4 custom-scrollbar">
                                    {ATS_STAGES.filter(s => s.stepOrder <= 7).map(stage => {
                                        const stageCand = candidates.filter(c => c.stage === stage.id);
                                        return (
                                            <div key={stage.id} className="p-3 rounded-xl border min-w-[210px] flex flex-col h-[600px] bg-zinc-100/80 border-zinc-200">
                                                <div className="flex items-center justify-between pb-2 mb-2 border-b border-zinc-300">
                                                    <h4 className="text-[11px] font-extrabold text-zinc-800 uppercase">{stage.title}</h4>
                                                    <span className="text-[10px] bg-zinc-200 px-2 py-0.5 rounded-full font-bold">{stageCand.length}</span>
                                                </div>
                                                <div className="space-y-2 flex-1 overflow-y-auto custom-scrollbar pr-1">
                                                    {stageCand.map(c => (
                                                        <div key={c.id} className="bg-white p-3 rounded-xl border border-zinc-200 shadow-sm space-y-2">
                                                            <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-rose-50 text-lnc-pink">{c.candidate_type || 'Tutor'}</span>
                                                            <h5 className="font-bold text-xs text-zinc-900">{c.full_name} ({c.nickname || '-'})</h5>
                                                            <p className="text-[10px] text-zinc-500 line-clamp-1">{c.job_title}</p>
                                                            <div className="pt-2 border-t flex space-x-1">
                                                                <button onClick={() => setSelectedCandidateDetail(c)} className="w-1/2 py-1 bg-zinc-50 border text-[10px] rounded font-bold">ประวัติ</button>
                                                                <button onClick={() => setActiveStageModal(c)} className="w-1/2 py-1 bg-lnc-pink text-white text-[10px] rounded font-bold">ย้าย ➔</button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}

                            {currentTab === 'backup' && (
                                <div className="space-y-4">
                                    <div className="bg-zinc-900 text-white p-5 rounded-xl shadow-md">
                                        <h3 className="font-bold text-sm">📥 คลังรายชื่อตัวสำรอง (Backup Pool)</h3>
                                        <p className="text-xs text-zinc-400">รายชื่อผู้สมัครที่เก็บไว้พิจารณาในตำแหน่งอื่น หรือสามารถเรียกกลับมาสัมภาษณ์เพิ่มได้ทันที</p>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {candidates.filter(c => c.stage === 'Backup Pool').map(c => (
                                            <div key={c.id} className="bg-white p-4 rounded-xl border shadow-sm space-y-2 text-xs">
                                                <div className="flex justify-between items-start">
                                                    <strong className="text-sm text-zinc-900">{c.full_name} ({c.nickname || '-'})</strong>
                                                    <span className="bg-slate-100 text-slate-700 px-2 py-0.5 rounded text-[10px] font-bold">ตัวสำรอง</span>
                                                </div>
                                                <p className="text-zinc-500">{c.job_title}</p>
                                                <p className="text-[11px] text-zinc-600">เบอร์: {c.phone} | Line: {c.line_id}</p>
                                                <button onClick={() => setSelectedCandidateDetail(c)} className="w-full mt-2 py-2 bg-zinc-900 text-white font-bold rounded-lg">ดูประวัติเต็ม &rarr;</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {currentTab === 'employees' && (
                                <div className="space-y-4">
                                    <div className="bg-zinc-900 text-white p-5 rounded-xl shadow-md">
                                        <h3 className="font-bold text-sm">🏢 ระบบพนักงานประจำ & รหัสพนักงาน (Official Employee Directory)</h3>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {employees.map(e => (
                                            <div key={e.id} className="bg-white p-4 rounded-xl border shadow-sm space-y-2 text-xs">
                                                <div className="flex justify-between">
                                                    <span className="font-mono bg-rose-50 text-lnc-pink font-black px-2 py-0.5 rounded border border-rose-200">{e.empCode}</span>
                                                    <span className="bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded text-[10px]">{e.type}</span>
                                                </div>
                                                <h4 className="font-bold text-sm text-zinc-900 mt-1">{e.name}</h4>
                                                <p className="text-zinc-500">{e.role}</p>
                                                <p className="text-[11px] text-zinc-400">ประจำสาขา: {e.branch}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {toast && (
                        <div className="fixed bottom-6 right-6 bg-zinc-900 text-white px-4 py-3 rounded-xl shadow-xl text-xs flex items-center space-x-2 border-l-4 border-lnc-pink z-50">
                            <span>{toast}</span>
                        </div>
                    )}

                    {selectedCandidateDetail && (
                        <CandidateDetailModal candidate={selectedCandidateDetail} onClose={() => setSelectedCandidateDetail(null)} onActionClick={(c) => setActiveStageModal(c)} onConvertToEmployee={handleConvertToEmployee} />
                    )}

                    {activeStageModal && (
                        <StageActionModal candidate={activeStageModal} onClose={() => setActiveStageModal(null)} onSaveNextStage={handleSaveNextStage} />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
