        function RecruitmentView({ candidates, setCandidates, setActiveDemoModal, setSelectedCandidateDetail, showToast, supabaseUrl, supabaseKey }) {
            const stages = ['Application', 'Screening', 'Interview', 'Demo Teaching', 'Backup Pool', 'Offer', 'Probation', 'Passed Probation'];

            const handleStageMove = async (candId, newStage) => {
                setCandidates(candidates.map(c => c.id === candId ? { ...c, stage: newStage } : c));
                showToast(`ย้าย Candidate ไปยังขั้นตอน "${newStage}" เรียบร้อยแล้ว`);

                if (supabaseUrl && supabaseKey && window.supabase) {
                    try {
                        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
                        await supabase.from('candidates').update({ stage: newStage }).eq('id', candId);
                    } catch (e) {
                        console.error(e);
                    }
                }
            };

            return (
                <div className="space-y-6">
                    <div className="bg-zinc-900 text-white p-4 rounded-xl shadow-md flex items-center justify-between">
                        <div>
                            <span className="text-[10px] font-bold uppercase bg-lnc-pink text-white px-2 py-0.5 rounded tracking-wider">LNC ATS Pipeline</span>
                            <h3 className="text-lg font-bold mt-1">บอร์ดคัดเลือกติวเตอร์ & บุคลากร LNC Plus</h3>
                        </div>
                        <div className="text-right">
                            <span className="text-2xl font-extrabold text-white">{candidates.length}</span>
                            <p className="text-xs text-zinc-400">ใบสมัครทั้งหมด</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-8 gap-3 overflow-x-auto pb-4 custom-scrollbar">
                        {stages.map(stage => {
                            const stageCandidates = candidates.filter(c => c.stage === stage);
                            return (
                                <div key={stage} className="p-2.5 rounded-xl border min-w-[210px] flex flex-col h-[600px] bg-zinc-100/70 border-zinc-200">
                                    <div className="flex items-center justify-between pb-2 mb-2 border-b border-zinc-300">
                                        <h4 className="text-[11px] font-extrabold text-zinc-700 tracking-wide uppercase line-clamp-1">{stage}</h4>
                                        <span className="text-[10px] bg-zinc-200 text-zinc-700 font-bold px-2 py-0.5 rounded-full">{stageCandidates.length}</span>
                                    </div>

                                    <div className="space-y-2 flex-1 overflow-y-auto custom-scrollbar pr-1">
                                        {stageCandidates.map(c => (
                                            <div key={c.id} className="bg-white p-3 rounded-lg border border-zinc-200 shadow-sm hover:border-lnc-pink transition">
                                                <div className="flex items-start justify-between">
                                                    <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-rose-50 text-lnc-pink border border-rose-200">{c.type}</span>
                                                </div>

                                                <h5 onClick={() => setSelectedCandidateDetail(c)} className="font-bold text-xs text-zinc-900 mt-2 hover:text-lnc-pink cursor-pointer flex items-center justify-between">
                                                    <span>{c.name} {c.nickname ? `(${c.nickname})` : ''}</span>
                                                    <i data-lucide="chevron-right" className="w-3 h-3 text-zinc-400"></i>
                                                </h5>
                                                <p className="text-[11px] text-zinc-500 line-clamp-1">{c.jobTitle}</p>

                                                <div className="mt-3 pt-2 border-t border-zinc-100">
                                                    {stage === 'Demo Teaching' ? (
                                                        <button onClick={() => setActiveDemoModal(c)} className="w-full bg-lnc-pink text-white text-[10px] py-1 rounded font-medium">ประเมิน Demo</button>
                                                    ) : (
                                                        <select value={c.stage} onChange={(e) => handleStageMove(c.id, e.target.value)} className="w-full bg-zinc-50 text-[10px] border rounded p-1">
                                                            {stages.map(s => <option key={s} value={s}>{s}</option>)}
                                                        </select>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function DevelopmentView({ employees, developments, setActiveDevModal }) {
            const [selectedEmp, setSelectedEmp] = React.useState(employees[0] || null);

            return (
                <div className="space-y-6">
                    <div className="bg-zinc-900 text-white p-5 rounded-xl shadow-md flex items-center justify-between">
                        <div>
                            <span className="text-[10px] font-bold uppercase bg-lnc-pink text-white px-2 py-0.5 rounded tracking-wider">Quality & Capability Matrix</span>
                            <h3 className="text-lg font-bold mt-1">ระบบติดตามคุณภาพและการพัฒนาบุคลากร (Tutor Skill Quality)</h3>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="bg-white rounded-xl border border-zinc-200 p-4 shadow-sm space-y-3">
                            <h4 className="font-bold text-xs uppercase text-zinc-500 tracking-wider">รายชื่อบุคลากร / ติวเตอร์</h4>
                            <div className="space-y-2">
                                {employees.map(emp => (
                                    <div 
                                        key={emp.id}
                                        onClick={() => setSelectedEmp(emp)}
                                        className={`p-3 rounded-lg border cursor-pointer transition ${
                                            selectedEmp && selectedEmp.id === emp.id 
                                                ? 'border-lnc-pink bg-rose-50/50 shadow-sm' 
                                                : 'border-zinc-200 hover:border-zinc-300 bg-white'
                                        }`}
                                    >
                                        <div className="flex justify-between items-start">
                                            <span className="font-bold text-xs text-zinc-900">{emp.name}</span>
                                            <span className="text-[10px] bg-zinc-100 text-zinc-700 font-semibold px-1.5 py-0.5 rounded">{emp.type}</span>
                                        </div>
                                        <p className="text-[11px] text-zinc-500 mt-0.5">{emp.role}</p>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {selectedEmp && (
                            <div className="bg-white rounded-xl border border-zinc-200 p-5 shadow-sm lg:col-span-2 space-y-5">
                                <div className="flex items-center justify-between border-b pb-3">
                                    <div>
                                        <h4 className="font-black text-base text-zinc-900">{selectedEmp.name}</h4>
                                        <p className="text-xs text-zinc-500">{selectedEmp.role}</p>
                                    </div>
                                    <button 
                                        onClick={() => setActiveDevModal(selectedEmp)}
                                        className="bg-lnc-pink hover:bg-rose-700 text-white text-xs font-bold px-3.5 py-2 rounded-lg flex items-center space-x-1 transition shadow-sm"
                                    >
                                        <i data-lucide="plus" className="w-3.5 h-3.5"></i>
                                        <span>สร้างแผนพัฒนา (Action Plan)</span>
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    <h5 className="text-xs font-bold uppercase text-zinc-500">Skill Competency vs Target Score (1-5)</h5>
                                    {selectedEmp.skills.map(sk => {
                                        const isGap = sk.score < sk.target;
                                        return (
                                            <div key={sk.name} className="space-y-1">
                                                <div className="flex justify-between text-xs">
                                                    <span className="font-semibold text-zinc-800">{sk.name}</span>
                                                    <span className="font-bold">
                                                        <span className={isGap ? 'text-rose-600' : 'text-emerald-600'}>{sk.score}</span> / {sk.target} คะแนน
                                                    </span>
                                                </div>
                                                <div className="w-full bg-zinc-100 h-3 rounded-full overflow-hidden relative">
                                                    <div className={`h-full rounded-full ${isGap ? 'bg-amber-500' : 'bg-emerald-500'}`} style={{ width: `${(sk.score / 5) * 100}%` }}></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function TrainingView({ trainings }) {
            return (
                <div className="space-y-6">
                    <div className="bg-zinc-900 text-white p-5 rounded-xl shadow-md flex items-center justify-between">
                        <div>
                            <span className="text-[10px] font-bold uppercase bg-lnc-pink text-white px-2 py-0.5 rounded tracking-wider">Capability Building</span>
                            <h3 className="text-lg font-bold mt-1">ศูนย์ฝึกอบรม & Workshop (Training Hub)</h3>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl border border-zinc-200 shadow-sm p-5 space-y-4">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {trainings.map(t => (
                                <div key={t.id} className="p-4 bg-zinc-50 rounded-xl border border-zinc-200 space-y-3">
                                    <div className="flex justify-between items-start">
                                        <span className="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded">{t.status}</span>
                                        <span className="text-xs text-zinc-400">👥 ผู้เข้าร่วม {t.participantsCount} คน</span>
                                    </div>
                                    <h5 className="font-bold text-sm text-zinc-900">{t.title}</h5>
                                    <div className="text-xs text-zinc-600 space-y-1">
                                        <p>📅 วันที่: {t.date} | {t.time}</p>
                                        <p>📍 สถานที่: {t.branch}</p>
                                        <p>👨‍🏫 วิทยากร: {t.instructor}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        /* STREAMING_CHUNK:Main App Entry Component... */
        function App() {
            const [currentTab, setCurrentTab] = React.useState('dashboard');
            const [selectedBranch, setSelectedBranch] = React.useState('ALL');
            
            const [supabaseUrl, setSupabaseUrl] = React.useState(localStorage.getItem('lnc_sp_url') || '');
            const [supabaseKey, setSupabaseKey] = React.useState(localStorage.getItem('lnc_sp_key') || '');
            const [showConfigModal, setShowConfigModal] = React.useState(false);
            const [isDbConnected, setIsDbConnected] = React.useState(false);

            const [candidates, setCandidates] = React.useState(INITIAL_CANDIDATES);
            const [employees, setEmployees] = React.useState(INITIAL_EMPLOYEES);
            const [developments, setDevelopments] = React.useState(INITIAL_DEVELOPMENTS);
            const [jobs, setJobs] = React.useState(INITIAL_JOBS);
            const [trainings, setTrainings] = React.useState(INITIAL_TRAININGS);

            const [activeDemoModal, setActiveDemoModal] = React.useState(null);
            const [activeDevModal, setActiveDevModal] = React.useState(null);
            const [activeJobModal, setActiveJobModal] = React.useState(false);
            const [selectedCandidateDetail, setSelectedCandidateDetail] = React.useState(null);

            const [toast, setToast] = React.useState(null);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            };

            const fetchFromSupabase = React.useCallback(async () => {
                if (!supabaseUrl || !supabaseKey || !window.supabase) return;
                try {
                    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
                    const { data: candData, error: candErr } = await supabase.from('candidates').select('*').order('created_at', { ascending: false });
                    if (!candErr && candData && candData.length > 0) {
                        const mappedCands = candData.map(c => ({
                            id: c.id,
                            name: c.full_name,
                            nickname: c.nickname || '',
                            jobTitle: c.job_title || 'คุณครูประจำ',
                            type: c.candidate_type || 'Tutor',
                            stage: c.stage || 'Application',
                            branchId: 'b1',
                            phone: c.phone || '-',
                            email: c.email || '-',
                            education: c.education_level || 'ปริญญาตรี',
                            expectedSalary: c.expected_salary || '-',
                            source: c.source || 'เพจ Facebook',
                            score: null
                        }));
                        setCandidates(mappedCands);
                        setIsDbConnected(true);
                    }
                } catch (err) {
                    console.error('Supabase fetch error:', err);
                }
            }, [supabaseUrl, supabaseKey]);

            React.useEffect(() => {
                fetchFromSupabase();
            }, [fetchFromSupabase]);

            React.useEffect(() => {
                if (window.lucide && typeof window.lucide.createIcons === 'function') {
                    window.lucide.createIcons();
                }
            });

            const handleSaveConfig = (e) => {
                e.preventDefault();
                localStorage.setItem('lnc_sp_url', supabaseUrl);
                localStorage.setItem('lnc_sp_key', supabaseKey);
                setShowConfigModal(false);
                fetchFromSupabase();
                showToast('บันทึกการเชื่อมต่อ Supabase เรียบร้อยแล้ว');
            };

            const filterByBranch = (item) => {
                if (selectedBranch === 'ALL') return true;
                return item.branchId === selectedBranch;
            };

            return (
                <div className="flex h-screen overflow-hidden bg-lnc-bg">
                    {/* Sidebar Navigation */}
                    <aside className="w-64 bg-lnc-dark text-white flex flex-col justify-between shrink-0 shadow-lg">
                        <div>
                            <div className="p-5 border-b border-zinc-800 flex items-center justify-between">
                                <div className="flex items-center space-x-3">
                                    <div className="bg-lnc-pink text-white w-9 h-9 rounded-lg flex items-center justify-center font-bold text-xl tracking-tighter shadow-md">
                                        LNC<span className="text-xs text-white font-light">+</span>
                                    </div>
                                    <div>
                                        <h1 className="font-bold text-base leading-tight tracking-wide">LNC PLUS HR</h1>
                                        <p className="text-[10px] text-zinc-400">Step to Beyond Learning</p>
                                    </div>
                                </div>
                            </div>

                            <div className="p-4 border-b border-zinc-800">
                                <label className="text-[11px] font-semibold text-zinc-400 block mb-1">เลือกสาขา / Branch Filter</label>
                                <select 
                                    value={selectedBranch} 
                                    onChange={(e) => setSelectedBranch(e.target.value)}
                                    className="w-full bg-zinc-800 text-xs text-zinc-200 rounded-md p-2 border border-zinc-700 focus:outline-none focus:border-lnc-pink"
                                >
                                    <option value="ALL">ทุกสาขา (All Branches)</option>
                                    {INITIAL_BRANCHES.map(b => (
                                        <option key={b.id} value={b.id}>{b.name}</option>
                                    ))}
                                </select>
                            </div>

                            <nav className="p-4 space-y-1">
                                <NavItem icon="layout-dashboard" label="Dashboard" active={currentTab === 'dashboard'} onClick={() => setCurrentTab('dashboard')} />
                                <NavItem icon="users" label="Recruitment ATS" badge={candidates.length} active={currentTab === 'recruitment'} onClick={() => setCurrentTab('recruitment')} />
                                <NavItem icon="trending-up" label="People Development" badge={developments.filter(d => d.status !== 'Completed').length} active={currentTab === 'development'} onClick={() => setCurrentTab('development')} />
                                <NavItem icon="award" label="Training Hub" active={currentTab === 'training'} onClick={() => setCurrentTab('training')} />
                            </nav>
                        </div>

                        <div className="p-4 border-t border-zinc-800 flex items-center justify-between text-xs text-zinc-400">
                            <div>
                                <p className="font-medium text-zinc-200 text-xs">HR Admin Portal</p>
                                <p className={`text-[10px] ${isDbConnected ? 'text-emerald-400 font-bold' : 'text-amber-400'}`}>
                                    {isDbConnected ? '⚡ Supabase Live Connected' : '☁️ Local / GitHub Mode'}
                                </p>
                            </div>
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <main className="flex-1 flex flex-col overflow-hidden">
                        <header className="bg-white border-b border-zinc-200 px-8 py-3.5 flex items-center justify-between shadow-sm">
                            <div>
                                <h2 className="text-lg font-bold text-zinc-900">
                                    {currentTab === 'dashboard' && 'HR Executive Overview'}
                                    {currentTab === 'recruitment' && 'Recruitment Pipeline (ATS)'}
                                    {currentTab === 'development' && 'Tutor Quality & People Development'}
                                    {currentTab === 'training' && 'Training & Capability Building'}
                                </h2>
                                <p className="text-xs text-zinc-500 mt-0.5">
                                    สถาบันกวดวิชา LNC Plus • Step to Beyond Learning
                                </p>
                            </div>

                            <div className="flex items-center space-x-2">
                                <button onClick={() => setShowConfigModal(true)} className="bg-zinc-100 hover:bg-zinc-200 text-zinc-800 border text-xs font-semibold px-3 py-2 rounded-lg flex items-center space-x-1 transition shadow-sm">
                                    <i data-lucide="database" className="w-4 h-4 text-lnc-pink"></i>
                                    <span>⚙️ ตั้งค่า Supabase DB</span>
                                </button>
                                <button onClick={() => setActiveJobModal(true)} className="bg-lnc-pink hover:bg-rose-700 text-white text-xs font-semibold px-3.5 py-2 rounded-lg flex items-center space-x-1 transition shadow-sm">
                                    <i data-lucide="plus" className="w-4 h-4"></i>
                                    <span>เปิดตำแหน่งงานใหม่</span>
                                </button>
                            </div>
                        </header>

                        <div className="flex-1 overflow-y-auto p-8 custom-scrollbar">
                            {currentTab === 'dashboard' && (
                                <DashboardView 
                                    candidates={candidates.filter(filterByBranch)}
                                    employees={employees.filter(filterByBranch)}
                                    developments={developments}
                                    trainings={trainings}
                                    jobs={jobs.filter(filterByBranch)}
                                    setSelectedCandidateDetail={setSelectedCandidateDetail}
                                />
                            )}

                            {currentTab === 'recruitment' && (
                                <RecruitmentView 
                                    candidates={candidates.filter(filterByBranch)}
                                    setCandidates={setCandidates}
                                    setActiveDemoModal={setActiveDemoModal}
                                    setSelectedCandidateDetail={setSelectedCandidateDetail}
                                    showToast={showToast}
                                    supabaseUrl={supabaseUrl}
                                    supabaseKey={supabaseKey}
                                />
                            )}

                            {currentTab === 'development' && (
                                <DevelopmentView 
                                    employees={employees.filter(filterByBranch)}
                                    developments={developments}
                                    setActiveDevModal={setActiveDevModal}
                                />
                            )}

                            {currentTab === 'training' && (
                                <TrainingView trainings={trainings} />
                            )}
                        </div>
                    </main>

                    {/* Supabase Config Modal */}
                    {showConfigModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <form onSubmit={handleSaveConfig} className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                                <div className="flex items-start justify-between border-b pb-3">
                                    <div>
                                        <h3 className="font-bold text-base text-zinc-900">เชื่อมต่อ Supabase Database</h3>
                                        <p className="text-xs text-zinc-500">ใส่ Supabase URL และ Key สำหรับใช้งานฐานข้อมูลจริง</p>
                                    </div>
                                    <button type="button" onClick={() => setShowConfigModal(false)} className="text-zinc-400 font-bold">✕</button>
                                </div>
                                <div className="space-y-3 text-xs">
                                    <div>
                                        <label className="font-bold block mb-1">Supabase URL</label>
                                        <input type="url" placeholder="https://xyzcompany.supabase.co" value={supabaseUrl} onChange={e => setSupabaseUrl(e.target.value)} className="w-full border p-2 rounded-lg font-mono text-[11px]" required />
                                    </div>
                                    <div>
                                        <label className="font-bold block mb-1">Supabase Anon Key</label>
                                        <input type="password" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6..." value={supabaseKey} onChange={e => setSupabaseKey(e.target.value)} className="w-full border p-2 rounded-lg font-mono text-[11px]" required />
                                    </div>
                                </div>
                                <div className="flex justify-end space-x-2 pt-2 border-t">
                                    <button type="button" onClick={() => setShowConfigModal(false)} className="px-3 py-2 border rounded-lg text-xs font-semibold">ยกเลิก</button>
                                    <button type="submit" className="px-4 py-2 bg-lnc-pink text-white rounded-lg text-xs font-bold hover:bg-rose-700">บันทึก & เชื่อมต่อ</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed bottom-6 right-6 bg-zinc-900 text-white px-4 py-3 rounded-lg shadow-xl text-xs flex items-center space-x-2 border-l-4 border-lnc-pink z-50">
                            <i data-lucide="check-circle" className="w-4 h-4 text-lnc-pink"></i>
                            <span>{toast}</span>
                        </div>
                    )}

                    {/* Modals */}
                    {activeDemoModal && (
                        <DemoTeachingModal 
                            candidate={activeDemoModal} 
                            onClose={() => setActiveDemoModal(null)} 
                            onSave={(id, updatedScore, newStage) => { 
                                setCandidates(candidates.map(c => c.id === id ? { ...c, score: updatedScore, stage: newStage } : c)); 
                                setActiveDemoModal(null); 
                                showToast('บันทึกผลการประเมิน Demo Teaching เรียบร้อย!'); 
                            }} 
                        />
                    )}
                    {selectedCandidateDetail && (
                        <CandidateDetailModal 
                            candidate={selectedCandidateDetail} 
                            onClose={() => setSelectedCandidateDetail(null)} 
                            onUpdateStage={(id, newStage) => { 
                                setCandidates(candidates.map(c => c.id === id ? { ...c, stage: newStage } : c)); 
                                setSelectedCandidateDetail(null); 
                                showToast(`อัปเดตสถานะเป็น "${newStage}" เรียบร้อย`); 
                            }} 
                        />
                    )}
                    {activeDevModal && (
                        <CreateDevPlanModal 
                            employee={activeDevModal} 
                            onClose={() => setActiveDevModal(null)} 
                            onSave={(newPlan) => { 
                                setDevelopments([newPlan, ...developments]); 
                                setActiveDevModal(null); 
                                showToast('สร้างแผนพัฒนาเรียบร้อยแล้ว'); 
                            }} 
                        />
                    )}
                    {activeJobModal && (
                        <CreateJobModal 
                            branches={INITIAL_BRANCHES} 
                            onClose={() => setActiveJobModal(false)} 
                            onSave={(newJob) => { 
                                setJobs([newJob, ...jobs]); 
                                setActiveJobModal(false); 
                                showToast('เปิดประกาศรับสมัครงานเรียบร้อยแล้ว'); 
                            }} 
                        />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
